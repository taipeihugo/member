# 官網自動發布：main 分支的 官網/ 資料夾有變動時，發布到 GitHub Pages
# 第一次使用前：到 GitHub 儲存庫 Settings → Pages → Source 選「GitHub Actions」
name: 發布官網
on:
  push:
    branches: [main]
    paths: ["官網/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 官網
      - id: deployment
        uses: actions/deploy-pages@v4
