// 畫出會費與帳務頁（四個頁籤）
function 繪製會費帳務(容器, 參數) {
  容器.appendChild(頁首("會費與帳務"));
  const 頁籤 = 建立頁籤(["會費收繳", "催繳", "收支記帳", "收支決算表"], 參數.頁籤, function (名, 區) {
    if (名 === "會費收繳") 繪製收繳(區);
    else if (名 === "催繳") 繪製催繳(區);
    else if (名 === "收支記帳") 繪製記帳(區);
    else 繪製決算表(區);
  });
  容器.appendChild(頁籤.元素);
}

// ===== 共用計算 =====

// 查某會員某年度某項目的繳費紀錄
function 繳費紀錄(會員id, 年度, 項目) {
  return 集合("會費").find(function (f) { return f.會員id === 會員id && Number(f.年度) === Number(年度) && f.項目 === (項目 || "常年會費"); }) || null;
}

// 某年度應繳常年會費的會員：目前有效、且在該年底前入會
function 應繳會員(年度) {
  return 集合("會員").filter(function (m) {
    return m.會籍狀態 === "有效" && (!m.入會日期 || m.入會日期 <= 年度 + "-12-31");
  });
}

// 某年度還沒繳常年會費的有效會員
function 未繳名單(年度) {
  return 應繳會員(年度).filter(function (m) { return !繳費紀錄(m.id, 年度, "常年會費"); });
}

// 產生下一個收據號（民國年-流水號，例：115-0001）
function 下一個收據號(年度) {
  const 前綴 = 民國年(年度) + "-";
  const 最大 = 集合("會費").reduce(function (m, f) {
    if (String(f.收據號 || "").indexOf(前綴) !== 0) return m;
    const n = Number(String(f.收據號).slice(前綴.length));
    return n > m ? n : m;
  }, 0);
  return 前綴 + 補零(最大 + 1, 4);
}

// 產生下一個傳票號（民國年＋收／支＋流水號，例：115收001）
function 下一個傳票號(日期, 收支) {
  const 前綴 = 民國年(String(日期).slice(0, 4)) + (收支 === "收入" ? "收" : "支");
  const 最大 = 集合("傳票").reduce(function (m, v) {
    if (String(v.傳票號 || "").indexOf(前綴) !== 0) return m;
    const n = Number(String(v.傳票號).slice(前綴.length));
    return n > m ? n : m;
  }, 0);
  return 前綴 + 補零(最大 + 1, 3);
}

// 依名稱找會計科目代碼（找不到回傳空字串）
function 科目代碼(名稱) {
  const s = 狀態.資料.設定.會計科目.find(function (k) { return k.名稱 === 名稱; });
  return s ? s.代碼 : "";
}

// 科目代碼轉成「代碼 名稱」
function 科目名稱(代碼) {
  const s = 狀態.資料.設定.會計科目.find(function (k) { return k.代碼 === 代碼; });
  return s ? s.名稱 : 代碼 || "";
}

// 登記繳費：每人一筆會費紀錄（含收據號），並合記一張收入傳票；回傳會費紀錄陣列
function 登記繳費(選項) {
  const 會員們 = 選項.會員們.filter(function (m) { return !繳費紀錄(m.id, 選項.年度, 選項.項目); });
  if (!會員們.length) return [];
  const 科目 = 科目代碼(選項.項目 === "入會費" ? "入會費收入" : "常年會費收入");
  const 傳票 = 新增紀錄("傳票", {
    傳票號: 下一個傳票號(選項.日期, "收入"), 日期: 選項.日期, 收支: "收入", 科目: 科目,
    金額: 選項.金額 * 會員們.length,
    摘要: 民國年(選項.年度) + " 年度" + 選項.項目 + "（" + (會員們.length === 1 ? 會員們[0].姓名 : 會員們.length + " 人") + "）",
    對象: 會員們.length === 1 ? 會員們[0].姓名 : "會員", 來源: "會費"
  });
  return 會員們.map(function (m) {
    return 新增紀錄("會費", {
      會員id: m.id, 姓名: m.姓名, 年度: Number(選項.年度), 項目: 選項.項目, 金額: 選項.金額, 繳費日: 選項.日期,
      方式: 選項.方式 || "現金", 收據號: 下一個收據號(選項.年度), 傳票id: 傳票.id, 經手人: 操作者()
    }, "會費「" + m.姓名 + " " + 民國年(選項.年度) + " 年度" + 選項.項目 + "」");
  });
}

// 作廢一筆繳費：刪除會費紀錄，並從對應傳票扣回金額（扣到 0 就刪除傳票）
function 作廢繳費(會費id) {
  const f = 找("會費", 會費id);
  if (!f) return;
  const v = f.傳票id ? 找("傳票", f.傳票id) : null;
  if (v) {
    const 剩 = Number(v.金額) - Number(f.金額);
    if (剩 <= 0) 刪除紀錄("傳票", v.id, "傳票「" + v.傳票號 + "」（繳費作廢）");
    else 更新紀錄("傳票", v.id, { 金額: 剩, 摘要: v.摘要 + "（" + f.姓名 + " 作廢）" });
  }
  刪除紀錄("會費", 會費id, "作廢收據「" + f.收據號 + "」");
}

// 產生一張收據（兩聯：收執聯、存根聯）
function 收據節點(f) {
  const 設 = 狀態.資料.設定;
  const 會員 = 找("會員", f.會員id) || {};
  const 一聯 = function (聯名) {
    return h("div", { class: "收據" },
      h("div", { class: "聯別" }, 聯名),
      h("h1", null, 設.協會名稱 + "　收據"),
      h("div", { class: "副標" }, "收據號：" + f.收據號 + (設.範例資料 ? "　（範例資料）" : "")),
      h("table", null, h("tbody", null,
        h("tr", null, h("td", null, "繳款人"), h("td", null, f.姓名 + (會員.會員編號 ? "（會員編號 " + 會員.會員編號 + "）" : ""))),
        h("tr", null, h("td", null, "服務機關"), h("td", null, (會員.服務機關 || "") + " " + (會員.單位 || ""))),
        h("tr", null, h("td", null, "繳費項目"), h("td", null, 民國年(f.年度) + " 年度" + f.項目)),
        h("tr", null, h("td", null, "金額"), h("td", null, "新臺幣 " + 國字金額(f.金額) + "（NT$ " + 金額(f.金額) + "）")),
        h("tr", null, h("td", null, "繳費日期"), h("td", null, 民國(f.繳費日) + "　繳費方式：" + (f.方式 || ""))))),
      h("div", { class: "簽名列" }, h("span", null, "理事長：＿＿＿＿＿"), h("span", null, "會計：＿＿＿＿＿"), h("span", null, "經手人：" + (f.經手人 || "＿＿＿＿＿"))));
  };
  return h("div", { class: "列印頁" }, 一聯("第一聯　收執聯（交繳款人）"), 一聯("第二聯　存根聯（協會存查）"));
}

// 年度下拉選單（從最早有資料的年度到明年）
function 年度選單(目前, 變更) {
  const 年們 = new Set([本年(), 本年() + 1]);
  集合("傳票").forEach(function (v) { if (v.日期) 年們.add(Number(v.日期.slice(0, 4))); });
  集合("會費").forEach(function (f) { 年們.add(Number(f.年度)); });
  const 選 = h("select", { "aria-label": "年度", onchange: function () { 變更(Number(選.value)); } },
    Array.from(年們).sort().reverse().map(function (y) { return h("option", { value: y, selected: y === 目前 }, 民國年(y) + " 年度"); }));
  return 選;
}

// ===== 會費收繳 =====

// 畫「會費收繳」頁籤
function 繪製收繳(區, 年度) {
  年度 = 年度 || 本年();
  清空(區);
  const 設 = 狀態.資料.設定;
  const 標準 = Number(設.會費標準.常年會費) || 0;
  const 可收 = 可("會費.收繳");
  // 每位應繳會員一列（加上該年度已繳但現在不是有效會員的人）
  const 列們 = function () {
    const 名單 = 應繳會員(年度).slice();
    集合("會費").forEach(function (f) {
      if (Number(f.年度) === 年度 && f.項目 === "常年會費" && !名單.some(function (m) { return m.id === f.會員id; })) {
        const m = 找("會員", f.會員id);
        if (m) 名單.push(m);
      }
    });
    return 名單.map(function (m) {
      const f = 繳費紀錄(m.id, 年度, "常年會費");
      return { id: m.id, 會員: m, 會費: f, 會員編號: m.會員編號, 姓名: m.姓名, 服務機關: m.服務機關, 狀態: f ? "已繳" : "未繳",
        繳費日: f ? f.繳費日 : "", 金額: f ? Number(f.金額) : 0, 收據號: f ? f.收據號 : "", 方式: f ? f.方式 : "" };
    });
  };
  const 統計 = h("p", { class: "次要字" });
  const 更新統計 = function () {
    const 全 = 列們();
    const 已 = 全.filter(function (r) { return r.會費; });
    const 收 = 已.reduce(function (s, r) { return s + r.金額; }, 0);
    統計.textContent = 民國年(年度) + " 年度常年會費標準 " + 金額(標準) + " 元：應繳 " + 全.length + " 人，已繳 " + 已.length + " 人（" + 金額(收) + " 元），未繳 " + (全.length - 已.length) + " 人；收繳率 " + (全.length ? Math.round(已.length / 全.length * 1000) / 10 : 0) + "%";
  };
  const 重整 = function () { 表.重繪(); 更新統計(); };
  const 表 = 資料表({
    匯出檔名: 民國年(年度) + "年度常年會費收繳",
    資料: 列們,
    預設排序: { key: "會員編號" },
    欄位: [
      { key: "會員編號", 標題: "編號" }, { key: "姓名", 標題: "姓名" }, { key: "服務機關", 標題: "服務機關" },
      { key: "狀態", 標題: "繳費狀態", 顯示: function (r) { return h("span", { class: "標記 " + (r.會費 ? "成" : "危") }, r.狀態); } },
      { key: "繳費日", 標題: "繳費日", 顯示: function (r) { return 民國(r.繳費日); } },
      { key: "金額", 標題: "金額", 數字: true, 顯示: function (r) { return r.會費 ? 金額(r.金額) : ""; } },
      { key: "收據號", 標題: "收據號" }, { key: "方式", 標題: "方式" }
    ],
    篩選: [
      { 標題: "狀態", 選項: ["已繳", "未繳"], 取值: function (r) { return r.狀態; } },
      { 標題: "機關", 選項: function () { return 設.服務機關; }, 取值: function (r) { return r.服務機關; } }
    ],
    點列: function (r) { 繳費明細(r, 年度, 重整); },
    批次: [
      可收 ? { 文字: "登記繳費", 動作: function (列) { 登記繳費對話框(列.filter(function (r) { return !r.會費; }).map(function (r) { return r.會員; }), 年度, 重整); } } : null,
      { 文字: "列印收據", 動作: function (列) {
        const 已 = 列.filter(function (r) { return r.會費; });
        if (!已.length) return 提示("勾選的人都還沒繳費", true);
        列印詢問(已.map(function (r) { return 收據節點(r.會費); }));
      } }
    ].filter(Boolean)
  });
  區.appendChild(h("div", { class: "表工具列" }, h("label", null, "年度 ", 年度選單(年度, function (y) { 繪製收繳(區, y); })),
    h("span", { class: "次要字 小字" }, "勾選未繳的會員後按「登記繳費」；點一列可列印收據或作廢")));
  區.appendChild(統計);
  區.appendChild(表.元素);
  更新統計();
}

// 登記繳費對話框：選繳費日期與方式
function 登記繳費對話框(會員們, 年度, 完成後) {
  if (!會員們.length) return 提示("勾選的人都已繳費", true);
  const 設 = 狀態.資料.設定;
  return 表單對話框("登記 " + 民國年(年度) + " 年度常年會費（" + 會員們.length + " 人）", [
    { key: "金額", 標題: "每人金額", 類型: "金額", 必填: true, 預設: 設.會費標準.常年會費, 最小: 0 },
    { key: "日期", 標題: "繳費日期", 類型: "日期", 必填: true, 預設: 今天() },
    { key: "方式", 標題: "繳費方式", 類型: "選單", 選項: ["現金", "轉帳", "薪資扣繳"], 必填: true, 預設: "現金" },
    { key: "列印", 標題: "收據", 類型: "勾選", 預設: 會員們.length === 1, 勾選文字: "登記後列印收據" }
  ], {}, function (值) {
    if (!(值.金額 > 0)) return "金額要大於 0";
    const 紀錄們 = 登記繳費({ 會員們: 會員們, 年度: 年度, 項目: "常年會費", 金額: 值.金額, 日期: 值.日期, 方式: 值.方式 });
    提示("已登記 " + 紀錄們.length + " 人繳費，記得存檔");
    if (完成後) 完成後();
    if (值.列印 && 紀錄們.length) 列印詢問(紀錄們.map(收據節點));
  });
}

// 一位會員的繳費明細：列印收據、作廢或登記
function 繳費明細(r, 年度, 完成後) {
  const 按鈕 = [{ 文字: "關閉" }];
  if (r.會費) {
    if (可("帳務.編輯")) 按鈕.unshift({ 文字: "作廢", 危: true, 動作: async function (關) {
      if (!(await 確認("確定作廢收據 " + r.收據號 + "？對應傳票金額會一併扣回。", "作廢"))) return false;

      { key: "科目", 標題: "科目", 值: function (r) { return r.科目 + " " + 科目名稱(r.科目); } },
      { key: "摘要", 標題: "摘要" }, { key: "對象", 標題: "對象" },

    ],

      { 標題: "月份", 選項: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"].map(function (m) { return m + "月"; }), 取值: function (r) { return String(r.日期).slice(5, 7) + "月"; } },

// 新增或修改一張傳票（會費產生的傳票只能改摘要與備註）
function 編輯傳票(id, 完成後) {
  const 原 = id ? 找("傳票", id) : null;
  const 來自會費 = 原 && 原.來源 === "會費";
  const 欄位們 = 傳票欄位().map(function (f) { return 來自會費 && ["日期", "科目", "金額"].indexOf(f.key) >= 0 ? Object.assign({}, f, { 唯讀: true }) : f; });
  const 選項 = {};
  if (原) {
    // 編輯既有傳票時，額外提供刪除按鈕
    選項.額外按鈕 = [{
      文字: "刪除傳票", 危: true, 動作: async function (關) {
        if (來自會費) { 提示("這張傳票由會費收繳產生，請到「會費收繳」作廢該筆繳費", true); return false; }
        if (!(await 確認("確定刪除傳票 " + 原.傳票號 + "？", "刪除"))) return false;
        刪除紀錄("傳票", id);
        關(null);
        if (完成後) 完成後();
      }
    }];
  }
  return 表單對話框(原 ? "傳票 " + 原.傳票號 : "記一筆收支", 欄位們, 原 || {}, function (值) {
    if (來自會費) { 更新紀錄("傳票", id, { 摘要: 值.摘要, 對象: 值.對象, 備註: 值.備註 }); if (完成後) 完成後(); return; }
    if (!(值.金額 > 0)) return "金額要大於 0";
    const 科 = 狀態.資料.設定.會計科目.find(function (k) { return k.代碼 === 值.科目; });
    值.收支 = 科 ? 科.類別 : "支出";
    if (原) {
      if (原.收支 !== 值.收支 || 原.日期.slice(0, 4) !== 值.日期.slice(0, 4)) 值.傳票號 = 下一個傳票號(值.日期, 值.收支);
      更新紀錄("傳票", id, 值);
    } else {
      值.傳票號 = 下一個傳票號(值.日期, 值.收支);
      新增紀錄("傳票", 值);
    }
    提示("已記帳，記得存檔");
    if (完成後) 完成後();
  }, 選項);
}

// ===== 收支決算表 =====

// 計算某年度各科目的決算數、預算數與比較
function 決算資料(年度) {
  const 科目們 = 狀態.資料.設定.會計科目;
  const 傳票們 = 集合("傳票").filter(function (v) { return String(v.日期).slice(0, 4) === String(年度); });
  const 預算們 = 集合("預算").filter(function (b) { return Number(b.年度) === Number(年度); });
  const 列 = function (類別) {
    return 科目們.filter(function (k) { return k.類別 === 類別; }).map(function (k) {
      const 決算 = 傳票們.filter(function (v) { return v.科目 === k.代碼; }).reduce(function (s, v) { return s + Number(v.金額); }, 0);
      const 預 = 預算們.find(function (b) { return b.科目 === k.代碼; });
      const 預算 = 預 ? Number(預.金額) || 0 : 0;
      return { 代碼: k.代碼, 名稱: k.名稱, 決算: 決算, 預算: 預算, 差: 決算 - 預算, 說明: 預 ? 預.說明 || "" : "" };
    });
  };
  const 收入 = 列("收入"), 支出 = 列("支出");
  const 加總 = function (列們, k) { return 列們.reduce(function (s, r) { return s + r[k]; }, 0); };
  return {
    收入: 收入, 支出: 支出,
    收入合計: { 決算: 加總(收入, "決算"), 預算: 加總(收入, "預算") },
    支出合計: { 決算: 加總(支出, "決算"), 預算: 加總(支出, "預算") }
  };
}

// 產生收支決算表的表格（畫面與列印共用）

  const 合計列 = function (名, t) { return h("tr", { style: "font-weight:700" }, h("td", null, 名), 數(t.決算), 數(t.預算), 增減(t.決算 - t.預算), h("td", null, "")); };
  const 餘絀決算 = d.收入合計.決算 - d.支出合計.決算, 餘絀預算 = d.收入合計.預算 - d.支出合計.預算;
  return h("table", { class: "表", id: "決算表" },
    h("thead", null,
      h("tr", null, h("th", { rowspan: 2 }, "科目"), h("th", { rowspan: 2, class: "數" }, "本年度決算數"), h("th", { rowspan: 2, class: "數" }, "本年度預算數"),
        h("th", { colspan: 2, class: "置中" }, "決算與預算比較"), h("th", { rowspan: 2 }, "說明")),
      h("tr", null, h("th", { class: "數" }, "增加"), h("th", { class: "數" }, "減少"))),
    h("tbody", null,
      h("tr", null, h("td", { colspan: 6, style: "font-weight:700" }, "收入")), d.收入.map(科目列), 合計列("收入合計", d.收入合計),
      h("tr", null, h("td", { colspan: 6, style: "font-weight:700" }, "支出")), d.支出.map(科目列), 合計列("支出合計", d.支出合計),
      h("tr", { style: "font-weight:700" }, h("td", null, 餘絀決算 >= 0 ? "本期賸餘" : "本期短絀"), 數(Math.abs(餘絀決算)), 數(Math.abs(餘絀預算)), 增減(餘絀決算 - 餘絀預算), h("td", null, ""))));
}

  區.appendChild(h("div", { class: "卡" }, h("div", { class: "置中" }, 標頭()), h("div", { class: "表捲" }, 決算表格(年度)), h("p", { class: "小字 次要字" }, 依據)));

// 匯出收支決算表
function 匯出決算表(年度, 格式) {
  const d = 決算資料(年度);
  const 表 = [["科目", "本年度決算數", "本年度預算數", "比較增加", "比較減少", "說明"]];
  const 加 = function (r, 名) { const 差 = r.決算 - r.預算; 表.push([名 || r.名稱, r.決算, r.預算, 差 > 0 ? 差 : 0, 差 < 0 ? -差 : 0, r.說明 || ""]); };
  表.push(["收入", "", "", "", "", ""]); d.收入.forEach(function (r) { 加(r); }); 加(d.收入合計, "收入合計");
  表.push(["支出", "", "", "", "", ""]); d.支出.forEach(function (r) { 加(r); }); 加(d.支出合計, "支出合計");
  加({ 決算: d.收入合計.決算 - d.支出合計.決算, 預算: d.收入合計.預算 - d.支出合計.預算 }, "本期餘絀");
  匯出表格(民國年(年度) + "年度收支決算表", 表, 格式);
}

// 編列某年度各科目預算數與說明
function 編輯預算(年度, 完成後) {
  const 科目們 = 狀態.資料.設定.會計科目;
  const 預算們 = 集合("預算").filter(function (b) { return Number(b.年度) === 年度; });
  const 欄位們 = [];
  const 初值 = {};
  科目們.forEach(function (k) {
    欄位們.push({ key: "金額_" + k.代碼, 標題: k.代碼 + " " + k.名稱 + "（" + k.類別 + "）", 類型: "金額", 最小: 0 });
    欄位們.push({ key: "說明_" + k.代碼, 標題: "說明" });
    const b = 預算們.find(function (x) { return x.科目 === k.代碼; });
    初值["金額_" + k.代碼] = b ? b.金額 : "";
    初值["說明_" + k.代碼] = b ? b.說明 || "" : "";
  });
  return 表單對話框(民國年(年度) + " 年度預算數", 欄位們, 初值, function (值) {
    科目們.forEach(function (k) {
      const 金 = 值["金額_" + k.代碼] === "" ? 0 : Number(值["金額_" + k.代碼]);
      const 說 = 值["說明_" + k.代碼] || "";
      const b = 預算們.find(function (x) { return x.科目 === k.代碼; });
      if (b) 更新紀錄("預算", b.id, { 金額: 金, 說明: 說 }, "預算「" + 民國年(年度) + " " + k.名稱 + "」");
      else if (金 || 說) 新增紀錄("預算", { 年度: 年度, 科目: k.代碼, 金額: 金, 說明: 說 }, "預算「" + 民國年(年度) + " " + k.名稱 + "」");
    });
    提示("已更新預算數");
    if (完成後) 完成後();
  }, { 寬: true });
}

// 檔案說明：活動報名（建立活動、名額與候補、報名名單、匯入官網報名檔、簽到、出席率、通知名單、成果紀錄與照片）

// 活動欄位定義
function 活動欄位() {
  return [

    { key: "日期", 標題: "活動日期", 類型: "日期", 必填: true },
    { key: "開始時間", 標題: "開始時間", 類型: "時間" },
    { key: "結束時間", 標題: "結束時間", 類型: "時間" },
    { key: "地點", 標題: "地點" },
    { key: "名額", 標題: "名額（0＝不限）", 類型: "數字", 最小: 0, 預設: 0 },
    { key: "候補名額", 標題: "候補名額", 類型: "數字", 最小: 0, 預設: 0 },

  ];
}

// 某活動的報名統計：正取、候補、取消、簽到人數與出席率
function 活動統計(活動id) {
  const 列 = 集合("報名").filter(function (r) { return r.活動id === 活動id; });
  const 正取 = 列.filter(function (r) { return r.狀態 === "正取"; });
  const 簽到 = 正取.filter(function (r) { return r.簽到時間; }).length;
  return {
    正取: 正取.length, 候補: 列.filter(function (r) { return r.狀態 === "候補"; }).length,
    取消: 列.filter(function (r) { return r.狀態 === "取消"; }).length, 簽到: 簽到,
    出席率: 正取.length ? Math.round(簽到 / 正取.length * 1000) / 10 : null
  };
}

// 活動目前的狀態文字（報名中、已截止、已結束）
function 活動狀態(a) {
  const 今 = 今天();
  if (a.日期 < 今) return "已結束";
  if (a.截止日 && a.截止日 < 今) return "已截止";
  return "報名中";
}

// 畫活動列表

      { key: "名額", 標題: "名額", 數字: true, 值: function (r) { return Number(r.名額) || 0; }, 顯示: function (r) { return Number(r.名額) ? String(r.名額) : "不限"; } },
      { key: "正取", 標題: "正取", 數字: true, 值: function (r) { return 活動統計(r.id).正取; } },
      { key: "候補", 標題: "候補", 數字: true, 值: function (r) { return 活動統計(r.id).候補; } },

    ],

  // 已結束活動的平均出席率

  const 總正取 = 已辦.reduce(function (s, x) { return s + x.正取; }, 0), 總簽到 = 已辦.reduce(function (s, x) { return s + x.簽到; }, 0);

    可編 ? h("button", { class: "鈕 主", type: "button", id: "新增活動鈕", onclick: function () { 編輯活動(null, function (a) { 前往("活動報名", { 活動id: a.id }); }); } }, "＋ 新增活動") : null,

  ]));

// 新增或編輯活動；完成後呼叫 完成後(活動)
function 編輯活動(id, 完成後) {
  const 原 = id ? 找("活動", id) : null;
  const 選項 = {};
  if (原) {
    選項.額外按鈕 = [{
      文字: "刪除活動", 危: true, 動作: async function (關) {
        const n = 集合("報名").filter(function (r) { return r.活動id === id; }).length;
        if (!(await 確認("確定刪除「" + 原.名稱 + "」？" + (n ? "（含 " + n + " 筆報名紀錄一併刪除）" : ""), "刪除"))) return false;
        集合("報名").filter(function (r) { return r.活動id === id; }).forEach(function (r) { 刪除紀錄("報名", r.id); });
        刪除紀錄("活動", id);
        關(null);
        前往("活動報名");
      }
    }];
  }
  return 表單對話框(原 ? "編輯活動" : "新增活動", 活動欄位(), 原 || { 日期: 今天(), 公開: true }, function (值) {
    if (值.截止日 && 值.截止日 > 值.日期) return "報名截止日不能晚於活動日期";
    ["名額", "候補名額", "費用"].forEach(function (k) { 值[k] = Number(值[k]) || 0; });
    const a = 原 ? 更新紀錄("活動", id, 值) : 新增紀錄("活動", Object.assign({ 照片: [], 成果說明: "", 成果公開: false }, 值));
    提示("已儲存活動");
    if (完成後) 完成後(a);
  }, 選項);
}

// 加入一筆報名：依名額決定正取或候補；額滿回傳錯誤文字
function 加入報名(活動, 值) {
  const 列 = 集合("報名").filter(function (r) { return r.活動id === 活動.id; });
  const 已有 = 列.find(function (r) {
    return r.狀態 !== "取消" && ((值.會員id && r.會員id === 值.會員id) || (!值.會員id && r.姓名 === 值.姓名 && (r.員工編號 || "") === (值.員工編號 || "")));
  });
  if (已有) return 值.姓名 + " 已經報名過了（" + 已有.狀態 + "）";
  const 正取數 = 列.filter(function (r) { return r.狀態 === "正取"; }).length;
  const 候補數 = 列.filter(function (r) { return r.狀態 === "候補"; }).length;
  let 狀 = "正取";
  if (Number(活動.名額) && 正取數 >= Number(活動.名額)) {
    if (候補數 >= Number(活動.候補名額 || 0)) return "名額與候補都已額滿";
    狀 = "候補";
  }
  return 新增紀錄("報名", Object.assign({ 活動id: 活動.id, 報名時間: 現在(), 狀態: 狀, 簽到時間: "", 已繳費: false, 來源: "手動" }, 值),
    "報名「" + 活動.名稱 + "：" + 值.姓名 + "（" + 狀 + "）」");
}

// 從會員資料帶出報名欄位
function 會員報名資料(m) {
  return { 會員id: m.id, 姓名: m.姓名, 員工編號: m.員工編號 || "", 服務機關: m.服務機關 || "", 單位: m.單位 || "", Email: m.Email || "", 電話: m.公務電話 || "" };
}

// 取消報名：若取消的是正取，第一位候補自動遞補
function 取消報名(r) {
  const 原狀 = r.狀態;
  更新紀錄("報名", r.id, { 狀態: "取消", 簽到時間: "" }, "取消報名「" + r.姓名 + "」");
  if (原狀 !== "正取") return null;
  const 候補 = 集合("報名").filter(function (x) { return x.活動id === r.活動id && x.狀態 === "候補"; }).sort(function (a, b) { return 比較(a.報名時間, b.報名時間); })[0];
  if (候補) { 更新紀錄("報名", 候補.id, { 狀態: "正取" }, "候補遞補「" + 候補.姓名 + "」"); return 候補; }
  return null;
}

// 畫活動詳細頁（資訊＋四個頁籤）
function 繪製活動詳細(容器, a, 預設頁籤) {
  const 可編 = 可("活動.編輯");

  ]));
  const s = 活動統計(a.id);
  容器.appendChild(h("div", { class: "卡", style: "margin-bottom:1rem" },

    h("p", { class: "次要字", style: "margin:.5rem 0 0" }, "正取 " + s.正取 + "、候補 " + s.候補 + "、已簽到 " + s.簽到 + (s.出席率 != null ? "、出席率 " + s.出席率 + "%" : "")),

// 從名冊挑會員加入報名（可搜尋姓名、機關、員工編號）
function 挑選會員報名(a, 完成後) {
  const 已報 = new Set(集合("報名").filter(function (r) { return r.活動id === a.id && r.狀態 !== "取消"; }).map(function (r) { return r.會員id; }));
  const 搜 = h("input", { type: "search", placeholder: "輸入姓名、機關或員工編號", id: "挑選搜尋", style: "width:100%" });

// 新增或編輯一個官網項目（下載檔案會把檔案存進 附件/官網下載/）
function 編輯官網項目(名, id, 完成後) {
  const 定 = 官網內容定義(名);
  const 原 = id ? 找(定.集合, id) : null;
  const 選項 = {};
  if (原) {
    選項.額外按鈕 = [{
      文字: "刪除", 危: true, 動作: async function (關) {
        if (!(await 確認("確定刪除這一項？", "刪除"))) return false;
        if (原.附件) await 刪附件(原.附件);
        刪除紀錄(定.集合, id);
        關(null);
        完成後();
      }
    }];
  }
  return 表單對話框((原 ? "編輯" : "新增") + "：" + 名, 定.欄位, 原 || {}, async function (值) {
    const 檔 = 值.檔案;
    delete 值.檔案;
    if (名 === "下載檔案") {
      if (!檔 && !(原 && 原.附件)) return "請選擇要提供下載的檔案";
      if (檔) {
        try {
          const 路徑 = await 存附件(["官網下載"], 檔);
          if (原 && 原.附件) await 刪附件(原.附件);
          值.附件 = 路徑;
          值.檔名 = 檔.name;
        } catch (e) { return e.message; }
      }
    }
    if (原) 更新紀錄(定.集合, id, 值); else 新增紀錄(定.集合, 值);
    提示("已儲存，發布到官網後才會更新網站");
    完成後();
  }, 選項);
}

// 發布：選官網資料夾 → 寫入 資料/site-data.js → 複製下載檔與公開照片到 資料/檔案/
async function 發布到官網資料夾() {
  try {
    const 夾 = await window.showDirectoryPicker({ id: "官網資料夾", mode: "readwrite" });
    if (夾.requestPermission && (await 夾.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("沒有取得資料夾的寫入權限");
    let 有首頁 = true;
    try { await 夾.getFileHandle("index.html"); } catch (e) { 有首頁 = false; }
    if (!有首頁 && !(await 確認("這個資料夾裡沒有 index.html，看起來不是官網資料夾。仍要寫入嗎？", "仍要寫入"))) return;
    const 時間 = 現在();
    const 官網資料 = 產生官網資料(狀態.資料, 時間);
    const 資料夾 = await 夾.getDirectoryHandle("資料", { create: true });
    const 檔案夾 = await 資料夾.getDirectoryHandle("檔案", { create: true });
    // 要複製的附件：下載檔＋公開活動的照片
    const 附件們 = 集合("下載").filter(function (d) { return d.公開 !== false && d.附件; }).map(function (d) { return d.附件; });
    集合("活動").filter(function (a) { return a.公開 && a.成果公開; }).forEach(function (a) { (a.照片 || []).forEach(function (p) { 附件們.push(p); }); });
    let 複製 = 0, 缺 = 0;
    for (const 路徑 of 附件們) {
      const f = await 讀附件(路徑);
      if (!f) { 缺++; continue; }
      await 寫檔(檔案夾, 路徑.split("/").pop(), f);
      複製++;
    }
    await 寫檔(資料夾, "site-data.js", 官網資料檔內容(官網資料));
    更新設定({ 最後發布: 時間, 最後發布人: 操作者() });
    記錄操作("發布", "官網", "發布官網資料（附件 " + 複製 + " 個）");
    提示("已發布到官網：資料檔＋" + 複製 + " 個檔案" + (缺 ? "（" + 缺 + " 個附件找不到）" : "") + "。記得存檔。");
    重新繪製();
  } catch (e) {
    if (e && e.name === "AbortError") return;
    提示("發布失敗：" + e.message, true);
  }
}

      return h("tr", { class: "可點", onclick: function () { 編輯(k); } }, h("td", null, k.代碼), h("td", null, k.名稱), h("td", null, k.類別),

// 檔案說明：啟動（側欄選單、換頁、表頭按鈕、深淺色切換、Ctrl+S 存檔、關頁提醒、關於視窗、測試掛勾）

// 換到某一頁（參數會傳給該頁的繪製函式）
function 前往(名稱, 參數) {
  const 頁 = 頁面表[名稱];
  if (!頁 || !狀態.使用者) return;
  if (頁.可見 && !頁.可見()) { 提示("您的角色沒有這個功能的權限", true); return; }
  狀態.目前頁 = 名稱;
  狀態.頁參數 = 參數 || null;
  繪製側欄();
  const 內容 = 清空(document.getElementById("內容"));
  try {
    頁.繪製(內容, 參數 || {});
  } catch (e) {
    內容.appendChild(h("p", { class: "錯誤" }, "畫面發生錯誤：" + e.message));
    throw e;
  }
  document.getElementById("側欄").classList.remove("開");
  內容.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

// 重新畫目前這一頁（例如存檔合併後資料變了）
function 重新繪製() {
  if (狀態.使用者 && 狀態.目前頁) 前往(狀態.目前頁, 狀態.頁參數);
}

// 畫左側功能選單（只列出目前角色看得到的功能）
function 繪製側欄() {
  const 側 = 清空(document.getElementById("側欄"));
  if (!狀態.使用者) return;
  頁面順序.forEach(function (名) {
    const 頁 = 頁面表[名];
    if (頁.可見 && !頁.可見()) return;
    if (頁.分隔) 側.appendChild(h("div", { class: "分隔" }));
    側.appendChild(h("button", { type: "button", "aria-current": 狀態.目前頁 === 名 ? "page" : null, onclick: function () { 前往(名); } },
      h("span", { class: "圖示", "aria-hidden": "true" }, 頁.圖示 || "•"), 名));
  });
  側.appendChild(h("div", { class: "分隔" }));
  側.appendChild(h("button", { type: "button", onclick: 改我的密碼 }, h("span", { class: "圖示", "aria-hidden": "true" }, "🔑"), "修改我的密碼"));
  側.appendChild(h("button", { type: "button", onclick: 關於 }, h("span", { class: "圖示", "aria-hidden": "true" }, "ℹ"), "關於本系統"));
  側.appendChild(h("button", { type: "button", id: "登出鈕", onclick: 登出 }, h("span", { class: "圖示", "aria-hidden": "true" }, "⏻"), "登出"));
}

// 更新表頭（協會名稱、使用者、存檔按鈕）與側欄
function 更新外框() {
  const 設 = 狀態.資料 && 狀態.資料.設定;
  document.getElementById("協會名").textContent = 設 ? 設.協會名稱 : "會務管理系統";
  document.title = (設 ? 設.協會名稱 + "｜" : "") + "會務管理系統 " + 版本;
  document.getElementById("使用者區").textContent = 狀態.使用者 ? 狀態.使用者.姓名 + "（" + 狀態.使用者.角色 + "）" : "";
  document.getElementById("存檔鈕").classList.toggle("隱藏", !(狀態.資料 && 狀態.使用者));
  document.getElementById("選單鈕").classList.toggle("隱藏", !狀態.使用者);
  更新存檔狀態();
  繪製側欄();
}

// 切換深色／淺色（記在使用者紀錄裡，下次登入沿用）
function 切換主題() {
  const 根 = document.documentElement;
  const 目前深 = 根.getAttribute("data-theme") ? 根.getAttribute("data-theme") === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  const 新 = 目前深 ? "light" : "dark";
  根.setAttribute("data-theme", 新);
  if (狀態.使用者 && 狀態.資料) {
    const u = 找("使用者", 狀態.使用者.id);
    if (u) { u.主題 = 新; 標記未存(); }
  }
}

// 顯示目前頁面的使用說明

  對話框("說明：" + (狀態.使用者 && 頁 ? 狀態.目前頁 : "開始使用"), [

      h("li", null, "角色只決定畫面上能做什麼，不是真正的資安控管；資料夾權限請由資訊單位設定。"))

// 關於本系統：版本、說明、使用的開源元件（本系統沒有使用外部元件）
function 關於() {

// 綁定表頭按鈕、快捷鍵與關頁提醒，然後顯示開始畫面
function 啟動() {
  document.getElementById("存檔鈕").addEventListener("click", function () { 執行存檔(); });
  document.getElementById("主題鈕").addEventListener("click", 切換主題);
  document.getElementById("說明鈕").addEventListener("click", 顯示說明);
  document.getElementById("選單鈕").addEventListener("click", function () { document.getElementById("側欄").classList.toggle("開"); });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (狀態.資料 && 狀態.使用者) 執行存檔(); }
  });
  window.addEventListener("beforeunload", function (e) {
    if (狀態.未存) { e.preventDefault(); e.returnValue = ""; }
  });
  顯示開始畫面();
  if (測試模式) window.__T = { 狀態: 狀態, 前往: 前往, 存檔: 存檔, 合併資料: 合併資料, 國字金額: 國字金額, 讀試算表: 讀試算表, 產生xlsx: 產生xlsx };
}

// 按存檔：顯示錯誤訊息而不是讓程式中斷
async function 執行存檔() {
  try {
    await 存檔();
  } catch (e) {
    提示("存檔失敗：" + e.message, true);
  }
}

啟動();
