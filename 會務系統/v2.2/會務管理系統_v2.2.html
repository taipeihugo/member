<style>
/* 共用主題：官網與會務系統共用的配色（深藍＋金）、深淺色、基本元件樣式 */

/* 淺色（預設）配色 */
:root {
  --navy: #2a2854;
  --gold: #c6951c;
  --gold-soft: #f3e7c6;
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #eeedf4;
  --text: #1d1c2b;
  --muted: #5d5c70;
  --line: #d9d7e3;
  --brand: #2a2854;
  --brand-text: #ffffff;
  --link: #2f2c8f;
  --danger: #b42318;
  --danger-soft: #fde8e6;
  --ok: #1f7a4d;
  --ok-soft: #e3f4ea;
  --warn: #9a6400;
  --warn-soft: #fdf1d8;
  --focus: #c6951c;
  --shadow: 0 1px 2px rgba(20, 18, 50, .08), 0 4px 14px rgba(20, 18, 50, .06);
  --radius: 10px;
  --font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
  --font-kai: "DFKai-SB", "標楷體", "BiauKai", "TW-Kai", serif;
  color-scheme: light;
}

/* 深色配色：系統偏好深色、且使用者沒有手動選淺色時 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gold: #d9aa3a;
    --gold-soft: #3b3220;
    --bg: #131226;
    --surface: #1d1c36;
    --surface-2: #26254a;
    --text: #ecebf5;
    --muted: #aeadc6;
    --line: #36355e;
    --brand: #3b3880;
    --link: #b9b6ff;
    --danger: #ff8a7a;
    --danger-soft: #3d1d1d;
    --ok: #6fd6a0;
    --ok-soft: #173326;
    --warn: #f0c060;
    --warn-soft: #3a2f16;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}

/* 深色配色：使用者手動切成深色時 */
:root[data-theme="dark"] {
  --gold: #d9aa3a;
  --gold-soft: #3b3220;
  --bg: #131226;
  --surface: #1d1c36;
  --surface-2: #26254a;
  --text: #ecebf5;
  --muted: #aeadc6;
  --line: #36355e;
  --brand: #3b3880;
  --link: #b9b6ff;
  --danger: #ff8a7a;
  --danger-soft: #3d1d1d;
  --ok: #6fd6a0;
  --ok-soft: #173326;
  --warn: #f0c060;
  --warn-soft: #3a2f16;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* 基本版面 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--link); }
img { max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 .6em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.隱藏 { display: none !important; }
.次要字 { color: var(--muted); }
.小字 { font-size: .875rem; }
.右 { text-align: right; }
.置中 { text-align: center; }
.不換行 { white-space: nowrap; }

/* 按鈕 */
.鈕 {
  display: inline-flex; align-items: center; justify-content: center; gap: .35em;
  min-height: 38px; padding: .4em 1em;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font: inherit; font-size: .95rem; cursor: pointer; text-decoration: none;
}
.鈕:hover { border-color: var(--gold); }
.鈕:disabled { opacity: .5; cursor: not-allowed; }
.鈕.主 { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
.鈕.金 { background: var(--gold); color: #1d1c2b; border-color: var(--gold); }
.鈕.危 { color: var(--danger); border-color: var(--danger); }
.鈕.小 { min-height: 30px; padding: .15em .65em; font-size: .85rem; }
.鈕.文字 { border-color: transparent; background: transparent; color: var(--link); }

/* 輸入欄位 */
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: .45em .6em; min-height: 38px;
  max-width: 100%;
}
textarea { min-height: 6em; width: 100%; resize: vertical; }
input[type="checkbox"], input[type="radio"] { min-height: 0; width: 1.1em; height: 1.1em; accent-color: var(--brand); }
label { cursor: pointer; }

/* 卡片 */
.卡 {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.2rem;
}

/* 標記（狀態小方塊） */
.標記 {
  display: inline-block; padding: 0 .55em; border-radius: 999px;
  font-size: .8rem; line-height: 1.7; background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}
.標記.成 { background: var(--ok-soft); color: var(--ok); }
.標記.危 { background: var(--danger-soft); color: var(--danger); }
.標記.警 { background: var(--warn-soft); color: var(--warn); }
.標記.金 { background: var(--gold-soft); color: var(--warn); }

/* 範例資料提示條 */
.範例條 {
  background: repeating-linear-gradient(-45deg, var(--warn-soft), var(--warn-soft) 10px, transparent 10px, transparent 20px);
  color: var(--warn); border: 1px dashed var(--warn); border-radius: 8px;
  padding: .3em .8em; font-size: .85rem; text-align: center;
}

/* 表格 */
.表 { width: 100%; border-collapse: collapse; font-size: .93rem; }
.表 th, .表 td { padding: .5em .6em; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.表 th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.表 td.數, .表 th.數 { text-align: right; font-variant-numeric: tabular-nums; }
.表捲 { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* 會務系統版面：表頭、側欄、內容區、對話框、資料表、列印 */

/* 整體框架 */
#應用 { min-height: 100vh; display: flex; flex-direction: column; }
.表頭 {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .7rem;
  padding: .45rem 1rem; background: var(--navy); color: #fff;
  border-bottom: 3px solid var(--gold);
}
.表頭 .會徽 { flex: none; }
.表頭名 { min-width: 0; }
.表頭名 .協會名 { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.表頭名 .次要字 { color: #cfcde6; }
.表頭右 { margin-left: auto; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
.表頭 .鈕 { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.表頭 .鈕:hover { border-color: var(--gold); }
.表頭 #使用者區 { color: #e8e6f6; }
.選單鈕 { display: none; color: #fff !important; font-size: 1.3rem; }
.主體 { flex: 1; display: flex; min-height: 0; }
.側欄 {
  flex: none; width: 210px; padding: .8rem .5rem; background: var(--surface);
  border-right: 1px solid var(--line); overflow-y: auto;
}
.側欄 button {
  display: flex; align-items: center; gap: .6em; width: 100%;
  padding: .55em .8em; margin-bottom: 2px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.側欄 button:hover { background: var(--surface-2); }
.側欄 button[aria-current="page"] { background: var(--navy); color: #fff; box-shadow: inset 4px 0 0 var(--gold); }
.側欄 .圖示 { width: 1.4em; text-align: center; }
.側欄 .分隔 { height: 1px; background: var(--line); margin: .6rem .4rem; }
.內容 { flex: 1; min-width: 0; padding: 1.2rem 1.4rem 3rem; outline: none; }

/* 頁面標題列 */
.頁首 { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: 1rem; }
.頁首 h1 { font-size: 1.45rem; margin: 0; }
.頁首 .工具 { margin-left: auto; display: flex; gap: .5rem; flex-wrap: wrap; }

/* 分頁籤 */
.頁籤 { display: flex; gap: .3rem; border-bottom: 2px solid var(--line); margin-bottom: 1rem; flex-wrap: wrap; }
.頁籤 button {
  border: 0; background: none; font: inherit; padding: .5em 1em; cursor: pointer; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -2px;
}
.頁籤 button[aria-selected="true"] { color: var(--text); font-weight: 700; border-bottom-color: var(--gold); }

/* 首頁統計格 */
.格 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 1rem; }
.格2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 1rem; margin-top: 1rem; }
.數字卡 .數字 { font-size: 2rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.數字卡 .標 { color: var(--muted); font-size: .9rem; }
.數字卡 { border-top: 4px solid var(--gold); }
.卡 h2 { font-size: 1.05rem; }
.清單 { list-style: none; margin: 0; padding: 0; }
.清單 li { padding: .45em 0; border-bottom: 1px dashed var(--line); display: flex; gap: .6em; align-items: baseline; }
.清單 li:last-child { border-bottom: 0; }
.條圖 { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: .5rem; }
.條圖 .柱 { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: .75rem; color: var(--muted); }
.條圖 .柱 i { display: block; width: 100%; max-width: 28px; background: var(--navy); border-radius: 4px 4px 0 0; min-height: 2px; }
:root[data-theme="dark"] .條圖 .柱 i { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .條圖 .柱 i { background: var(--gold); } }

/* 資料表元件 */
.表工具列 { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .6rem; }
.表工具列 input[type="search"] { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.表工具列 .右側 { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }
.表 th.可排序 { cursor: pointer; user-select: none; }
.表 th.可排序::after { content: " ↕"; color: var(--muted); font-weight: 400; }
.表 th[aria-sort="ascending"]::after { content: " ▲"; color: var(--gold); }
.表 th[aria-sort="descending"]::after { content: " ▼"; color: var(--gold); }
.表 tbody tr.可點 { cursor: pointer; }
.表 tbody tr:hover { background: var(--surface-2); }
.表 tbody tr.已選 { background: var(--gold-soft); }
.表 .勾 { width: 2.2em; }
.分頁列 { display: flex; gap: .4rem; align-items: center; justify-content: flex-end; margin-top: .6rem; flex-wrap: wrap; }
.批次列 { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; padding: .4rem .6rem; background: var(--gold-soft); border-radius: 8px; margin-bottom: .6rem; }
.空 { padding: 1.5rem; text-align: center; color: var(--muted); }

/* 表單 */
.表單 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .8rem 1rem; }
.表單 .欄 { display: flex; flex-direction: column; gap: .25rem; }
.表單 .欄.寬 { grid-column: 1 / -1; }
.表單 .欄 > span { font-size: .88rem; color: var(--muted); }
.表單 .欄 .必填::after { content: " *"; color: var(--danger); }
.表單 .欄 small { color: var(--muted); }
.標籤組 { display: flex; flex-wrap: wrap; gap: .3rem .8rem; }
.標籤組 label { display: inline-flex; gap: .3em; align-items: center; }
.錯誤 { color: var(--danger); }

/* 對話框 */
dialog.對話框 {
  border: 0; border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px));
  max-height: calc(100vh - 40px); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog.對話框.寬 { width: min(1080px, calc(100vw - 32px)); }
dialog.對話框::backdrop { background: rgba(14, 12, 40, .55); }
.對話框 .框頭 { display: flex; align-items: center; gap: .5rem; padding: .8rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.對話框 .框頭 h2 { margin: 0; font-size: 1.1rem; }
.對話框 .框頭 .關 { margin-left: auto; }
.對話框 .框身 { padding: 1rem 1.2rem; overflow-y: auto; max-height: calc(100vh - 180px); }
.對話框 .框尾 { display: flex; gap: .5rem; justify-content: flex-end; padding: .8rem 1.2rem; border-top: 1px solid var(--line); }
.保留換行 { white-space: pre-line; }

/* 提示訊息 */
.提示區 { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: .5rem; }
.提示 { background: var(--navy); color: #fff; padding: .6em 1em; border-radius: 8px; box-shadow: var(--shadow); border-left: 4px solid var(--gold); max-width: 420px; }
.提示.錯 { border-left-color: #ff6b5b; }

/* 歡迎與登入畫面 */
.歡迎 { max-width: 640px; margin: 2rem auto; }
.歡迎 .會徽大 { display: block; margin: 0 auto 1rem; width: 96px; height: 96px; }
.歡迎 h1 { text-align: center; }
.歡迎 .卡 { margin-top: 1rem; }
.提醒 { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: .6em .9em; font-size: .9rem; }

/* 衝突對照 */
.衝突 { border: 1px solid var(--line); border-radius: 10px; padding: .8rem; margin-bottom: .8rem; }
.衝突 table td:nth-child(2), .衝突 table td:nth-child(3) { width: 38%; }
.衝突 .不同 { background: var(--warn-soft); }

/* 簽到 */
.簽到輸入 { font-size: 1.3rem; padding: .5em .8em; width: 100%; max-width: 420px; }
.相片牆 { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .6rem; }
.相片牆 figure { margin: 0; }
.相片牆 img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }

/* 會員挑選清單 */
.挑選清單 { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.挑選清單 button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: .45em .7em; font: inherit; color: var(--text); cursor: pointer; }
.挑選清單 button:hover { background: var(--surface-2); }

/* 手機與窄螢幕 */
@media (max-width: 860px) {
  .選單鈕 { display: inline-flex; }
  .側欄 { position: fixed; top: 58px; bottom: 0; left: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .側欄.開 { transform: none; }
  .內容 { padding: 1rem; }
  .表頭右 #使用者區 { display: none; }
}

/* 列印：只印列印區，A4 直式 */
.列印區 { display: none; }
@media print {
  @page { size: A4 portrait; margin: 15mm; }
  body { background: #fff; color: #000; }
  #應用, .提示區 { display: none !important; }
  .列印區 { display: block; }
  .列印區.標楷 { font-family: var(--font-kai); }
  .列印頁 { page-break-after: always; break-after: page; }
  .列印頁:last-child { page-break-after: auto; break-after: auto; }
}
.列印區 .表 th { background: #eee; color: #000; }
.列印區 .表 th, .列印區 .表 td { border: 1px solid #555; }
.列印頁 h1 { text-align: center; font-size: 20pt; margin-bottom: .3em; }
.列印頁 .副標 { text-align: center; margin-bottom: 1em; }
.收據 { border: 2px solid #000; padding: 10mm; margin-bottom: 8mm; }
.收據 table { width: 100%; border-collapse: collapse; }
.收據 td { border: 1px solid #000; padding: 3mm; font-size: 13pt; }
.收據 .聯別 { text-align: right; font-size: 10pt; }
.簽名列 { display: flex; justify-content: space-around; margin-top: 12mm; }

</style>
</head>
<body>
<div id="應用">

(function () {
"use strict";
const 版本 = "v2.2";

/* ---------- 共用/工具.js ---------- */
// 檔案說明：共用工具（HTML 跳脫、建立畫面元素、日期與民國年、金額、CSV、下載），官網與會務系統共用

// 把文字裡的 HTML 特殊字元換成安全寫法，避免資料被當成程式碼執行
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// 檢查網址是否安全（只允許 http、https、mailto、tel、圖片 data:、blob: 與相對路徑），不安全就回傳 "#"
function 安全網址(url) {
  const s = String(url == null ? "" : url).trim();
  if (/^(https?:|mailto:|tel:|blob:|data:image\/)/i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return "#";
  return s;
}

// 建立一個畫面元素：h("div", {class:"x", onclick:函式}, "文字", 子元素…)；文字一律當純文字放入
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "value") el.value = v;
      else if (k === "checked" || k === "selected" || k === "disabled" || k === "multiple") el[k] = !!v;
      else if (k === "dataset") Object.assign(el.dataset, v);
      else if (k === "href" || k === "src") el.setAttribute(k, 安全網址(v));
      else el.setAttribute(k, v === true ? "" : v);
    }
  }
  加入子元素(el, Array.prototype.slice.call(arguments, 2));
  return el;
}

// 把子元素（文字、元素、陣列）依序加到父元素；文字會轉成純文字節點
function 加入子元素(el, kids) {
  for (const k of kids) {
    if (k == null || k === false) continue;
    if (Array.isArray(k)) { 加入子元素(el, k); continue; }
    el.appendChild(typeof k === "object" && k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}

// 清空一個元素裡的所有內容
function 清空(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

// 用安全方式把一段（已跳脫的）HTML 字串轉成元素片段：template.innerHTML → content
function 轉片段(html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  return t.content;
}

// 兩位數補零
function 補零(n, 位數) {
  return String(n).padStart(位數 || 2, "0");
}

// 取得今天日期（本機時間），格式 2026-10-07
function 今天() {
  const d = new Date();
  return d.getFullYear() + "-" + 補零(d.getMonth() + 1) + "-" + 補零(d.getDate());
}

// 取得現在時間（ISO 格式，含時區），用來記錄修改時間
function 現在() {
  return new Date().toISOString();
}

// 把 2026-10-07 這種日期轉成民國 115/10/07；空值回傳空字串
function 民國(日期) {
  if (!日期) return "";
  const m = String(日期).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(日期);
  return (Number(m[1]) - 1911) + "/" + m[2] + "/" + m[3];
}

// 把 ISO 時間轉成民國年月日＋時分，例：115/10/07 14:05
function 民國時間(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return (d.getFullYear() - 1911) + "/" + 補零(d.getMonth() + 1) + "/" + 補零(d.getDate()) + " " + 補零(d.getHours()) + ":" + 補零(d.getMinutes());
}

// 西元年轉民國年
function 民國年(西元年) {
  return Number(西元年) - 1911;
}

// 把民國日期（115/1/7、115.01.07、1150107）或西元日期轉成 2026-01-07；看不懂回傳空字串
function 解析日期(s) {
  s = String(s == null ? "" : s).trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if (m) return m[1] + "-" + 補零(m[2]) + "-" + 補零(m[3]);
  m = s.match(/^(\d{2,3})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if (m) return (Number(m[1]) + 1911) + "-" + 補零(m[2]) + "-" + 補零(m[3]);
  m = s.match(/^(\d{3})(\d{2})(\d{2})$/);
  if (m) return (Number(m[1]) + 1911) + "-" + m[2] + "-" + m[3];
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    // Excel 日期序號（1900 日期系統）
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000);
    return d.getUTCFullYear() + "-" + 補零(d.getUTCMonth() + 1) + "-" + 補零(d.getUTCDate());
  }
  return "";
}

// 金額加千分位，例：12345 → 12,345
function 金額(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString("en-US");
}

// 把金額轉成國字大寫（收據用），例：600 → 陸佰元整、10005 → 壹萬零伍元整
function 國字金額(n) {
  const 數 = ["零", "壹", "貳", "參", "肆", "伍", "陸", "柒", "捌", "玖"];
  const 小單位 = ["", "拾", "佰", "仟"];
  const 大單位 = ["", "萬", "億", "兆"];
  let v = Math.round(Math.abs(Number(n) || 0));
  if (!v) return "零元整";
  const 各組 = [];
  while (v > 0) { 各組.push(v % 10000); v = Math.floor(v / 10000); }
  let 結果 = "";
  let 前面有字 = false;
  let 待補零 = false;
  for (let g = 各組.length - 1; g >= 0; g--) {
    const x = 各組[g];
    if (x === 0) { if (前面有字) 待補零 = true; continue; }
    if (前面有字 && x < 1000) 待補零 = true;
    let 段 = "";
    let 段補零 = false;
    for (let i = 3; i >= 0; i--) {
      const d = Math.floor(x / Math.pow(10, i)) % 10;
      if (d === 0) { if (段) 段補零 = true; continue; }
      if (段補零) { 段 += "零"; 段補零 = false; }
      段 += 數[d] + 小單位[i];
    }
    結果 += (待補零 ? "零" : "") + 段 + 大單位[g];
    待補零 = false;
    前面有字 = true;
  }
  return 結果 + "元整";
}

// 產生一個不重複的編號（時間＋亂數）
function 新編號() {
  const 亂 = new Uint8Array(6);
  crypto.getRandomValues(亂);
  return Date.now().toString(36) + Array.from(亂, function (b) { return 補零(b.toString(16)); }).join("");
}

// 防公式注入：儲存格開頭是 = + - @ Tab 換行 時，前面加一個單引號
function 防公式(v) {
  const s = String(v == null ? "" : v);
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}

// 把二維陣列轉成 CSV 文字（含 BOM，Excel 開中文不亂碼；並防公式注入）
function 轉CSV(列) {
  const 行 = 列.map(function (r) {
    return r.map(function (v) {
      const s = 防公式(v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",");
  });
  return "﻿" + 行.join("\r\n") + "\r\n";
}

// 解析 CSV 文字成二維陣列（支援雙引號、欄內換行）
function 解析CSV(text) {
  text = String(text).replace(/^﻿/, "");
  const 列 = [];
  let 目前列 = [];
  let 欄 = "";
  let 引號中 = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (引號中) {
      if (c === '"') {
        if (text[i + 1] === '"') { 欄 += '"'; i++; } else 引號中 = false;
      } else 欄 += c;
    } else if (c === '"') 引號中 = true;
    else if (c === ",") { 目前列.push(欄); 欄 = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      目前列.push(欄); 欄 = "";
      列.push(目前列); 目前列 = [];
    } else 欄 += c;
  }
  if (欄 !== "" || 目前列.length) { 目前列.push(欄); 列.push(目前列); }
  return 列.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ""; }); });
}

// 下載檔案：用 Blob URL，1.5 秒後撤銷
function 下載檔案(檔名, 內容, 類型) {
  const blob = 內容 instanceof Blob ? 內容 : new Blob([內容], { type: 類型 || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = 檔名;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
}

// 比較兩個值做排序（數字比大小、文字依中文筆畫／字典順序）
function 比較(a, b) {
  if (a == null || a === "") return b == null || b === "" ? 0 : 1;
  if (b == null || b === "") return -1;
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b), "zh-Hant-TW", { numeric: true });
}

// 深拷貝一個資料物件（只含 JSON 能表示的內容）
function 深拷貝(o) {
  return o == null ? o : JSON.parse(JSON.stringify(o));
}

// 把欄位值轉成好讀的文字（陣列用頓號連接）
function 顯示值(v) {
  if (v == null) return "";
  if (Array.isArray(v)) return v.map(function (x) { return typeof x === "object" ? JSON.stringify(x) : x; }).join("、");
  if (typeof v === "object") return JSON.stringify(v);
  if (typeof v === "boolean") return v ? "是" : "否";
  return String(v);
}


/* ---------- 共用/官網資料.js ---------- */
// 檔案說明：把協會資料整理成「官網資料檔」（site-data.js）的內容；只放公開資訊，不含會員個資

// 從附件路徑取出官網上的檔案位置（附件/官網下載/abc_章程.pdf → 資料/檔案/abc_章程.pdf）
function 官網檔案位置(附件路徑) {
  const 檔名 = String(附件路徑 || "").split("/").pop();
  return 檔名 ? "資料/檔案/" + 檔名 : "";
}

// 依協會資料產生官網要用的資料物件（只挑「公開」的項目，依日期排序）
function 產生官網資料(資料, 發布時間) {
  const 設 = 資料.設定 || {};
  const 公開 = function (清單) { return (清單 || []).filter(function (x) { return x.公開 !== false; }); };
  const 依日期新到舊 = function (a, b) { return String(b.日期 || "").localeCompare(String(a.日期 || "")); };
  const 報名 = 資料.報名 || [];

  const 活動 = 公開(資料.活動).slice().sort(依日期新到舊).map(function (a) {
    const 正取數 = 報名.filter(function (r) { return r.活動id === a.id && r.狀態 === "正取"; }).length;
    const 成果公開 = a.成果公開 === true;
    return {
      id: a.id, 名稱: a.名稱, 類別: a.類別 || "", 日期: a.日期 || "", 開始時間: a.開始時間 || "", 結束時間: a.結束時間 || "",
      地點: a.地點 || "", 名額: Number(a.名額) || 0, 候補名額: Number(a.候補名額) || 0, 費用: Number(a.費用) || 0,
      截止日: a.截止日 || "", 說明: a.說明 || "", 已報名數: 正取數,
      成果說明: 成果公開 ? (a.成果說明 || "") : "",
      照片: 成果公開 ? (a.照片 || []).map(官網檔案位置) : []
    };
  });

  return {
    格式: "協會官網資料",
    格式版本: 1,
    發布時間: 發布時間 || "",
    範例資料: !!設.範例資料,
    協會: {
      名稱: 設.協會名稱 || "", 標語: 設.標語 || "", 宗旨: 設.宗旨 || "", 沿革: 設.沿革 || "", 章程: 設.章程 || "",
      地址: 設.地址 || "", 電話: 設.電話 || "", 傳真: 設.傳真 || "", Email: 設.Email || "", 服務時間: 設.服務時間 || "",
      組別: 設.組別 || [], 服務機關: 設.服務機關 || [],
      入會費: (設.會費標準 || {}).入會費 || 0, 常年會費: (設.會費標準 || {}).常年會費 || 0
    },
    理監事: (資料.理監事 || []).slice().sort(function (a, b) { return (Number(a.排序) || 0) - (Number(b.排序) || 0); })
      .map(function (p) { return { 職稱: p.職稱, 姓名: p.姓名, 服務機關: p.服務機關 || "" }; }),
    消息: 公開(資料.消息).slice().sort(function (a, b) {
      if (!!b.置頂 !== !!a.置頂) return b.置頂 ? 1 : -1;
      return 依日期新到舊(a, b);
    }).map(function (n) { return { id: n.id, 標題: n.標題, 分類: n.分類 || "", 日期: n.日期 || "", 內文: n.內文 || "", 置頂: !!n.置頂 }; }),
    活動: 活動,
    福利: 公開(資料.福利).map(function (b) { return { 名稱: b.名稱, 對象: b.對象 || "", 內容: b.內容 || "", 申請方式: b.申請方式 || "" }; }),
    特約商店: 公開(資料.特約商店).map(function (s) { return { 名稱: s.名稱, 類別: s.類別 || "", 優惠內容: s.優惠內容 || "", 地址: s.地址 || "", 電話: s.電話 || "" }; }),
    權益成果: 公開(資料.權益成果).slice().sort(依日期新到舊)
      .map(function (r) { return { 標題: r.標題, 類型: r.類型 || "", 日期: r.日期 || "", 摘要: r.摘要 || "", 結果: r.結果 || "" }; }),
    法規連結: (設.法規連結 || []).map(function (l) { return { 名稱: l.名稱, 網址: l.網址 }; }),
    下載: 公開(資料.下載).map(function (d) {
      return { 名稱: d.名稱, 分類: d.分類 || "", 說明: d.說明 || "", 檔案: 官網檔案位置(d.附件), 檔名: d.檔名 || "" };
    }),
    常見問答: 公開(資料.常見問答).slice().sort(function (a, b) { return (Number(a.排序) || 0) - (Number(b.排序) || 0); })
      .map(function (q) { return { 分類: q.分類 || "", 問題: q.問題, 答案: q.答案 }; })
  };
}

// 把官網資料物件轉成 site-data.js 的文字內容（JSON 內的 < 與換行分隔字元會跳脫，避免被誤判成標籤）
function 官網資料檔內容(官網資料) {
  const json = JSON.stringify(官網資料, null, 1)
    .replace(/</g, "\\u003c").replace(/>/g, "\\u003e")
    .replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
  return "/* 官網資料檔：由會務管理系統「發布到官網」產生，請勿手動修改 */\nwindow.SITE_DATA = " + json + ";\n";
}


/* ---------- 會務/01_核心.js ---------- */
// 檔案說明：核心（系統狀態、資料集合、角色權限、新增修改刪除紀錄、操作紀錄、提示、對話框、列印）

// ===== 系統狀態 =====
const 狀態 = {
  資料: null,        // 目前編輯中的協會資料（整份）
  基準: null,        // 上次讀入或存檔時磁碟上的內容（合併時用來判斷誰改了什麼）
  資料夾: null,      // 使用者選的協會資料夾（資料夾模式）
  檔案時間: 0,       // 上次讀入或存檔時，協會資料.json 的修改時間
  模式: "",          // "資料夾" 或 "單檔"（瀏覽器不支援資料夾功能時）
  檔名: "協會資料.json",
  使用者: null,      // 目前登入的使用者紀錄
  未存: false,       // 有沒有尚未存檔的變更
  目前頁: "",
  頁參數: null
};

// 資料檔裡的各個資料集合（每個都是陣列，每筆有 id、建立時間、修改時間、修改人）
const 集合清單 = ["使用者", "會員", "會員異動", "會費", "催繳", "傳票", "預算", "活動", "報名",
  "消息", "福利", "特約商店", "權益成果", "下載", "常見問答", "理監事", "操作紀錄"];

// 角色（只決定介面能做什麼，不是真正的資安控管）
const 角色清單 = ["理事長", "常務理事", "理事", "監事", "秘書長", "會計", "承辦人", "一般會員"];

// 各項動作允許哪些角色
const 權限表 = {
  "個資.檢視": ["理事長", "常務理事", "理事", "監事", "秘書長", "會計", "承辦人"],
  "會員.編輯": ["理事長", "秘書長", "承辦人"],
  "會費.收繳": ["理事長", "秘書長", "會計", "承辦人"],
  "帳務.檢視": ["理事長", "常務理事", "理事", "監事", "秘書長", "會計", "承辦人"],
  "帳務.編輯": ["理事長", "秘書長", "會計"],
  "活動.編輯": ["理事長", "秘書長", "承辦人"],
  "官網.編輯": ["理事長", "秘書長", "承辦人"],
  "設定.編輯": ["理事長", "秘書長"],
  "紀錄.檢視": ["理事長", "常務理事", "監事", "秘書長"]
};

// 判斷目前登入的人能不能做某個動作
function 可(權限) {
  const 角色 = 狀態.使用者 && 狀態.使用者.角色;
  return !!(角色 && 權限表[權限] && 權限表[權限].indexOf(角色) >= 0);
}

// ===== 資料存取 =====

// 取得某個集合（陣列）；不存在就建立空陣列
function 集合(名稱) {
  if (!狀態.資料[名稱]) 狀態.資料[名稱] = [];
  return 狀態.資料[名稱];
}

// 依 id 找一筆紀錄
function 找(名稱, id) {
  return 集合(名稱).find(function (r) { return r.id === id; }) || null;
}

// 目前操作者的名字（寫入修改人、操作紀錄）
function 操作者() {
  return 狀態.使用者 ? 狀態.使用者.姓名 : "系統";
}

// 新增一筆紀錄到集合，自動補上 id、建立時間、修改時間、修改人，並寫操作紀錄
function 新增紀錄(名稱, 物件, 摘要) {
  const 時間 = 現在();
  const r = Object.assign({ id: 新編號() }, 物件, { 建立時間: 時間, 修改時間: 時間, 修改人: 操作者() });
  集合(名稱).push(r);
  if (名稱 !== "操作紀錄") 記錄操作("新增", 名稱, 摘要 || 紀錄名稱(名稱, r));
  標記未存();
  return r;
}

// 修改一筆紀錄的部分欄位，自動更新修改時間與修改人，並把改了哪些欄位寫進操作紀錄
function 更新紀錄(名稱, id, 變更, 摘要) {
  const r = 找(名稱, id);
  if (!r) throw new Error("找不到要修改的資料");
  const 改了 = Object.keys(變更).filter(function (k) { return JSON.stringify(r[k]) !== JSON.stringify(變更[k]); });
  if (!改了.length) return r;
  Object.assign(r, 變更, { 修改時間: 現在(), 修改人: 操作者() });
  記錄操作("修改", 名稱, (摘要 || 紀錄名稱(名稱, r)) + "（" + 改了.join("、") + "）");
  標記未存();
  return r;
}

// 刪除一筆紀錄並寫操作紀錄
function 刪除紀錄(名稱, id, 摘要) {
  const 清單 = 集合(名稱);
  const i = 清單.findIndex(function (r) { return r.id === id; });
  if (i < 0) return;
  const r = 清單[i];
  清單.splice(i, 1);
  記錄操作("刪除", 名稱, 摘要 || 紀錄名稱(名稱, r));
  標記未存();
}

// 修改設定（設定是單一物件）
function 更新設定(變更) {
  Object.assign(狀態.資料.設定, 變更, { 修改時間: 現在(), 修改人: 操作者() });
  記錄操作("修改", "設定", Object.keys(變更).join("、"));
  標記未存();
}

// 給操作紀錄用的簡短名稱（例：會員「王小明」）
function 紀錄名稱(名稱, r) {
  const 名 = r.姓名 || r.名稱 || r.標題 || r.問題 || r.傳票號 || r.收據號 || "";
  return 名 ? 名稱 + "「" + 名 + "」" : 名稱;
}

// 寫一筆操作紀錄（誰在何時做了什麼），最多保留 5000 筆
function 記錄操作(動作, 對象, 說明) {
  const 時間 = 現在();
  const 清單 = 集合("操作紀錄");
  清單.push({ id: 新編號(), 時間: 時間, 人: 操作者(), 動作: 動作, 對象: 對象, 說明: 說明 || "", 建立時間: 時間, 修改時間: 時間, 修改人: 操作者() });
  if (清單.length > 5000) 清單.splice(0, 清單.length - 5000);
}

// 標記「有未存的變更」，並更新表頭狀態
function 標記未存() {
  狀態.未存 = true;
  更新存檔狀態();
}

// 更新表頭的存檔狀態文字
function 更新存檔狀態() {
  const el = document.getElementById("存檔狀態");
  if (!el) return;
  if (!狀態.資料) { el.textContent = ""; el.className = "標記"; return; }
  el.textContent = 狀態.未存 ? "有未存變更" : "已存檔";
  el.className = "標記 " + (狀態.未存 ? "警" : "成");
}

// ===== 提示與對話框 =====

// 在右下角顯示提示訊息，幾秒後自動消失
function 提示(訊息, 是錯誤) {
  const 區 = document.getElementById("提示區");
  const el = h("div", { class: "提示" + (是錯誤 ? " 錯" : "") }, 訊息);
  區.appendChild(el);
  setTimeout(function () { el.remove(); }, 是錯誤 ? 7000 : 3500);
}

// 開一個對話框；內容可以是元素或元素陣列，按鈕用 [{文字, 主, 動作}]；回傳 Promise（關閉時帶回結果）
function 對話框(標題, 內容, 按鈕, 選項) {
  選項 = 選項 || {};
  return new Promise(function (完成) {
    let 結果 = null;
    const 框 = h("dialog", { class: "對話框" + (選項.寬 ? " 寬" : ""), "aria-label": 標題 });
    const 關閉 = function (值) { 結果 = 值; 框.close(); };
    const 尾 = h("div", { class: "框尾" });
    (按鈕 || [{ 文字: "關閉" }]).forEach(function (b) {
      尾.appendChild(h("button", {
        type: "button", class: "鈕" + (b.主 ? " 主" : "") + (b.危 ? " 危" : ""),
        onclick: async function () {
          if (!b.動作) return 關閉(b.值 == null ? null : b.值);
          const v = await b.動作(關閉);
          if (v !== false && v !== undefined) 關閉(v);
        }
      }, b.文字));
    });
    框.appendChild(h("div", { class: "框頭" }, h("h2", null, 標題),
      h("button", { type: "button", class: "鈕 小 關", "aria-label": "關閉", onclick: function () { 關閉(null); } }, "✕")));
    框.appendChild(h("div", { class: "框身" }, 內容));
    框.appendChild(尾);
    框.addEventListener("close", function () { 框.remove(); 完成(結果); });
    document.body.appendChild(框);
    框.showModal();
    if (選項.開啟後) 選項.開啟後(框);
  });
}

// 確認對話框：回傳 true（確定）或 false（訊息裡的換行照樣顯示）
async function 確認(訊息, 確定文字) {
  const v = await 對話框("請確認", h("p", { class: "保留換行" }, 訊息), [
    { 文字: "取消", 值: false }, { 文字: 確定文字 || "確定", 主: true, 值: true }]);
  return v === true;
}

// 建立表單欄位元素；欄位定義 {key, 標題, 類型, 選項, 必填, 說明, 寬}
function 表單欄位(f, 值) {
  const id = "欄_" + 新編號();
  let 輸入;
  const v = 值 == null ? "" : 值;
  switch (f.類型) {
    case "多行":
      輸入 = h("textarea", { id: id, rows: f.行數 || 5 });
      輸入.value = v;
      break;
    case "選單":
      // 必填且還沒有值時放一個「請選擇」佔位（不能選回來），避免瀏覽器自動選第一項、讓必填檢查失效；
      // 選項本身已含空值（例如「無」）的欄位設 不加空白
      輸入 = h("select", { id: id },
        f.不加空白 ? null : f.必填 ? (v === "" || v == null ? h("option", { value: "", disabled: true, selected: true, hidden: true }, "請選擇") : null) : h("option", { value: "" }, "（未選）"),
        (typeof f.選項 === "function" ? f.選項() : f.選項 || []).map(function (o) {
          const 值o = typeof o === "object" ? o.值 : o;
          const 字 = typeof o === "object" ? o.字 : o;
          return h("option", { value: 值o, selected: String(值o) === String(v) }, 字);
        }));
      if (v !== "" && 輸入.value !== String(v)) 輸入.appendChild(h("option", { value: v, selected: true }, v));
      break;
    case "多選": {
      const 已選 = Array.isArray(v) ? v : [];
      輸入 = h("div", { class: "標籤組", id: id, role: "group" },
        (typeof f.選項 === "function" ? f.選項() : f.選項 || []).map(function (o) {
          return h("label", null, h("input", { type: "checkbox", value: o, checked: 已選.indexOf(o) >= 0 }), o);
        }));
      break;
    }
    case "勾選":
      輸入 = h("input", { id: id, type: "checkbox", checked: !!v });
      break;
    case "數字": case "金額":
      輸入 = h("input", { id: id, type: "number", step: "1", min: f.最小 == null ? null : f.最小, value: v });
      break;
    case "日期":
      輸入 = h("input", { id: id, type: "date", value: v });
      break;
    case "時間":
      輸入 = h("input", { id: id, type: "time", value: v });
      break;
    case "密碼":
      輸入 = h("input", { id: id, type: "password", autocomplete: "new-password", value: v });
      break;
    case "Email":
      輸入 = h("input", { id: id, type: "email", value: v });
      break;
    case "檔案":
      輸入 = h("input", { id: id, type: "file", accept: f.接受 || null });
      break;
    default:
      輸入 = h("input", { id: id, type: "text", value: v });
  }
  輸入.dataset.key = f.key;
  if (f.唯讀) 輸入.disabled = true;
  const 寬 = f.寬 || f.類型 === "多行" || f.類型 === "多選";
  return h("div", { class: "欄" + (寬 ? " 寬" : "") },
    h("span", { class: f.必填 ? "必填" : "" }, h("label", { for: id }, f.標題)),
    f.類型 === "勾選" ? h("label", null, 輸入, " " + (f.勾選文字 || "是")) : 輸入,
    f.說明 ? h("small", null, f.說明) : null);
}

// 讀出表單裡各欄位的值（依欄位類型轉成文字、數字、陣列或布林）
function 讀表單(表單, 欄位們) {
  const 值 = {};
  欄位們.forEach(function (f) {
    const el = 表單.querySelector('[data-key="' + f.key + '"]');
    if (!el) return;
    if (f.類型 === "多選") 值[f.key] = Array.from(el.querySelectorAll("input:checked")).map(function (c) { return c.value; });
    else if (f.類型 === "勾選") 值[f.key] = el.checked;
    else if (f.類型 === "檔案") 值[f.key] = el.files && el.files[0] ? el.files[0] : null;
    else if (f.類型 === "數字" || f.類型 === "金額") 值[f.key] = el.value === "" ? "" : Number(el.value);
    else 值[f.key] = el.value.trim();
  });
  return 值;
}

// 表單對話框：顯示欄位讓人填寫，按儲存時驗證必填並呼叫 儲存(值)；儲存回傳文字表示錯誤訊息
function 表單對話框(標題, 欄位們, 初值, 儲存, 選項) {
  初值 = 初值 || {};
  const 表單 = h("form", { class: "表單", onsubmit: function (e) { e.preventDefault(); } },
    欄位們.map(function (f) { return 表單欄位(f, 初值[f.key] == null ? f.預設 : 初值[f.key]); }));
  const 錯誤區 = h("p", { class: "錯誤", role: "alert" });
  // 選項.前言：表單上方的說明文字
  const 前言 = 選項 && 選項.前言 ? h("p", { class: "次要字 保留換行" }, 選項.前言) : null;
  return 對話框(標題, [前言, 表單, 錯誤區].filter(Boolean), ((選項 && 選項.額外按鈕) || []).concat([
    { 文字: "取消", 值: null },
    {
      文字: (選項 && 選項.儲存文字) || "儲存", 主: true, 動作: async function () {
        const 值 = 讀表單(表單, 欄位們);
        const 缺 = 欄位們.filter(function (f) {
          return f.必填 && (值[f.key] === "" || 值[f.key] == null || (Array.isArray(值[f.key]) && !值[f.key].length));
        });
        if (缺.length) { 錯誤區.textContent = "請填寫：" + 缺.map(function (f) { return f.標題; }).join("、"); return false; }
        const 結果 = await 儲存(值);
        if (typeof 結果 === "string") { 錯誤區.textContent = 結果; return false; }
        return 值;
      }
    }
  ]), 選項);
}

// ===== 選檔 =====

// 跳出選檔視窗，回傳使用者選的檔案陣列；暫時把選檔元素放進頁面，選完就移除（使用者按取消時不會回傳）
function 選擇檔案(接受, 多選) {
  // 清掉上次按取消而留下的選檔元素
  document.querySelectorAll("input.暫用選檔").forEach(function (el) { el.remove(); });
  return new Promise(function (完成) {
    const 選 = h("input", { type: "file", accept: 接受 || null, multiple: !!多選, class: "隱藏 暫用選檔" });
    選.addEventListener("change", function () {
      const 檔們 = Array.from(選.files || []);
      選.remove();
      if (檔們.length) 完成(檔們);
    });
    document.body.appendChild(選);
    選.click();
  });
}

// ===== 列印 =====

// 把內容放到列印區後呼叫瀏覽器列印（A4 直式；可選標楷體）
function 列印(內容, 標楷) {
  const 區 = document.getElementById("列印區");
  清空(區);
  區.className = "列印區" + (標楷 ? " 標楷" : "");
  加入子元素(區, [內容]);
  if (測試模式) { 狀態.最後列印 = 區.textContent; return; }
  setTimeout(function () { window.print(); }, 50);
}

// 列印前詢問是否使用標楷體，然後列印
async function 列印詢問(內容) {
  const v = await 對話框("列印", h("p", null, "要用哪一種字型列印？（A4 直式）"), [
    { 文字: "取消", 值: null }, { 文字: "一般字型", 值: "一般" }, { 文字: "標楷體", 主: true, 值: "標楷" }]);
  if (v) 列印(內容, v === "標楷");
}

// ===== 頁面註冊與頁籤 =====
const 頁面表 = {};
const 頁面順序 = [];

// 註冊一個功能頁：{標題, 圖示, 可見(), 繪製(容器, 參數), 說明}
function 註冊頁面(名稱, 定義) {
  頁面表[名稱] = 定義;
  頁面順序.push(名稱);

// 建立頁首（標題＋右側工具按鈕）

/* ---------- 會務/02_試算表.js ---------- */
// 檔案說明：讀寫試算表（自己解 zip：用瀏覽器內建 DecompressionStream；讀 xlsx／ods／csv，寫 xlsx）

// 用瀏覽器內建的解壓縮功能，把 deflate-raw 壓縮的資料解開
async function 解壓縮(位元組) {
  const 串流 = new Blob([位元組]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(串流).arrayBuffer());
}

// 讀 zip 檔的目錄，回傳 {檔名: 取出函式}；取出函式回傳該檔的位元組
function 讀zip目錄(buf) {
  const 資料 = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  // 從檔尾往前找「中央目錄結尾」標記 0x06054b50
  let 結尾 = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (資料.getUint32(i, true) === 0x06054b50) { 結尾 = i; break; }
  }
  if (結尾 < 0) throw new Error("不是有效的 zip 檔（xlsx／ods 都是 zip 格式）");
  const 筆數 = 資料.getUint16(結尾 + 10, true);
  let 位置 = 資料.getUint32(結尾 + 16, true);
  const 目錄 = {};
  const 解碼 = new TextDecoder("utf-8");
  for (let n = 0; n < 筆數; n++) {
    if (資料.getUint32(位置, true) !== 0x02014b50) throw new Error("zip 目錄格式錯誤");
    const 方法 = 資料.getUint16(位置 + 10, true);
    const 壓縮大小 = 資料.getUint32(位置 + 20, true);
    const 名長 = 資料.getUint16(位置 + 28, true);
    const 額外長 = 資料.getUint16(位置 + 30, true);
    const 註解長 = 資料.getUint16(位置 + 32, true);
    const 本地位置 = 資料.getUint32(位置 + 42, true);
    const 名 = 解碼.decode(buf.subarray(位置 + 46, 位置 + 46 + 名長));
    目錄[名] = async function () {
      const 本地名長 = 資料.getUint16(本地位置 + 26, true);
      const 本地額外長 = 資料.getUint16(本地位置 + 28, true);
      const 起 = 本地位置 + 30 + 本地名長 + 本地額外長;
      const 內容 = buf.subarray(起, 起 + 壓縮大小);
      if (方法 === 0) return 內容;
      if (方法 === 8) return 解壓縮(內容);
      throw new Error("不支援的壓縮方式：" + 方法);
    };
    位置 += 46 + 名長 + 額外長 + 註解長;
  }
  return 目錄;
}

// 從 zip 目錄取出一個檔案並轉成文字
async function zip取文字(目錄, 名) {
  if (!目錄[名]) return null;
  return new TextDecoder("utf-8").decode(await 目錄[名]());
}

// 把 XML 文字解析成文件物件
function 解析XML(文字) {
  return new DOMParser().parseFromString(文字, "application/xml");
}

// 取得 XML 元素裡指定「本地名稱」的子孫元素（不管命名空間前綴）
function 找元素(節點, 本地名) {
  return Array.from(節點.getElementsByTagNameNS("*", 本地名));
}

// 把 Excel 欄位代號（A、B…AA）轉成從 0 起算的欄號
function 欄號(代號) {
  let n = 0;
  for (const c of 代號) n = n * 26 + (c.charCodeAt(0) - 64);
  return n - 1;
}

// 讀 xlsx 的第一個工作表，回傳二維陣列（文字）
async function 讀xlsx(buf) {
  const 目錄 = 讀zip目錄(buf);
  const 共用字串 = [];
  const ss = await zip取文字(目錄, "xl/sharedStrings.xml");
  if (ss) {
    找元素(解析XML(ss), "si").forEach(function (si) {
      共用字串.push(找元素(si, "t").map(function (t) { return t.textContent; }).join(""));
    });
  }
  // 找第一個工作表的檔名（依 workbook.xml 與關聯檔）
  let 工作表檔 = "xl/worksheets/sheet1.xml";
  const wb = await zip取文字(目錄, "xl/workbook.xml");
  const rels = await zip取文字(目錄, "xl/_rels/workbook.xml.rels");
  if (wb && rels) {
    const 第一 = 找元素(解析XML(wb), "sheet")[0];
    const rid = 第一 && (第一.getAttribute("r:id") || 第一.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"));
    const 關聯 = 找元素(解析XML(rels), "Relationship").find(function (r) { return r.getAttribute("Id") === rid; });
    if (關聯) {
      const t = 關聯.getAttribute("Target").replace(/^\//, "");
      工作表檔 = t.indexOf("xl/") === 0 ? t : "xl/" + t;
    }
  }
  const 表 = await zip取文字(目錄, 工作表檔);
  if (!表) throw new Error("xlsx 裡找不到工作表");
  const 結果 = [];
  找元素(解析XML(表), "row").forEach(function (列) {
    const r = [];
    找元素(列, "c").forEach(function (格) {
      const 參照 = (格.getAttribute("r") || "").replace(/\d+/g, "");
      const 位 = 參照 ? 欄號(參照) : r.length;
      const 型 = 格.getAttribute("t");
      let 值 = "";
      if (型 === "s") 值 = 共用字串[Number((找元素(格, "v")[0] || {}).textContent)] || "";
      else if (型 === "inlineStr") 值 = 找元素(格, "t").map(function (t) { return t.textContent; }).join("");
      else { const v = 找元素(格, "v")[0]; 值 = v ? v.textContent : ""; }
      while (r.length < 位) r.push("");
      r[位] = 值;
    });
    結果.push(r);
  });
  return 結果.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ""; }); });
}

// 讀 ods（OpenDocument 試算表）的第一個工作表，回傳二維陣列
async function 讀ods(buf) {
  const 目錄 = 讀zip目錄(buf);
  const 內容 = await zip取文字(目錄, "content.xml");
  if (!內容) throw new Error("ods 裡找不到 content.xml");
  const 表 = 找元素(解析XML(內容), "table")[0];
  if (!表) return [];
  const 結果 = [];
  const TABLE = "urn:oasis:names:tc:opendocument:xmlns:table:1.0";
  找元素(表, "table-row").forEach(function (列) {
    const 列重複 = Math.min(Number(列.getAttributeNS(TABLE, "number-rows-repeated")) || 1, 1000);
    const r = [];
    Array.from(列.children).forEach(function (格) {
      if (格.localName !== "table-cell" && 格.localName !== "covered-table-cell") return;
      const 重複 = Math.min(Number(格.getAttributeNS(TABLE, "number-columns-repeated")) || 1, 200);
      const 值 = 找元素(格, "p").map(function (p) { return p.textContent; }).join("\n");
      for (let i = 0; i < 重複; i++) r.push(值);
    });
    while (r.length && r[r.length - 1] === "") r.pop();
    if (r.length) for (let i = 0; i < 列重複; i++) 結果.push(r.slice());
  });
  return 結果;
}

// 依副檔名讀取試算表檔（xlsx、ods、csv），回傳二維陣列
async function 讀試算表(檔案) {
  const 名 = 檔案.name.toLowerCase();
  const buf = new Uint8Array(await 檔案.arrayBuffer());
  if (名.endsWith(".xlsx")) return 讀xlsx(buf);
  if (名.endsWith(".ods")) return 讀ods(buf);
  if (名.endsWith(".csv") || 名.endsWith(".txt")) {
    // 先試 UTF-8，有亂碼就改用 Big5（舊版 Excel 存的 CSV）
    let 文字 = new TextDecoder("utf-8").decode(buf);
    if (文字.indexOf("�") >= 0) 文字 = new TextDecoder("big5").decode(buf);
    return 解析CSV(文字);
  }
  if (名.endsWith(".xls")) throw new Error("舊版 .xls 格式不支援，請在 Excel 另存成 .xlsx 或 .csv");
  throw new Error("只支援 .xlsx、.ods、.csv 檔");
}

// ===== 寫 xlsx =====

// 計算 CRC32 檢查碼（zip 格式需要）
const CRC表 = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

// 計算一段位元組的 CRC32
function crc32(位元組) {
  let c = 0xffffffff;
  for (let i = 0; i < 位元組.length; i++) c = CRC表[(c ^ 位元組[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// 把多個檔案包成 zip（不壓縮，格式最單純），回傳 Uint8Array
function 打包zip(檔案們) {
  const 編碼 = new TextEncoder();
  const 本地段 = [];
  const 目錄段 = [];
  let 位移 = 0;
  檔案們.forEach(function (f) {
    const 名 = 編碼.encode(f.名);
    const 內容 = typeof f.內容 === "string" ? 編碼.encode(f.內容) : f.內容;
    const crc = crc32(內容);
    const 頭 = new DataView(new ArrayBuffer(30));
    頭.setUint32(0, 0x04034b50, true); 頭.setUint16(4, 20, true); 頭.setUint16(6, 0x0800, true);
    頭.setUint16(8, 0, true); 頭.setUint32(14, crc, true);
    頭.setUint32(18, 內容.length, true); 頭.setUint32(22, 內容.length, true); 頭.setUint16(26, 名.length, true);
    本地段.push(new Uint8Array(頭.buffer), 名, 內容);
    const 目 = new DataView(new ArrayBuffer(46));
    目.setUint32(0, 0x02014b50, true); 目.setUint16(4, 20, true); 目.setUint16(6, 20, true); 目.setUint16(8, 0x0800, true);
    目.setUint32(16, crc, true); 目.setUint32(20, 內容.length, true); 目.setUint32(24, 內容.length, true);
    目.setUint16(28, 名.length, true); 目.setUint32(42, 位移, true);
    目錄段.push(new Uint8Array(目.buffer), 名);
    位移 += 30 + 名.length + 內容.length;
  });
  const 目錄大小 = 目錄段.reduce(function (s, b) { return s + b.length; }, 0);
  const 尾 = new DataView(new ArrayBuffer(22));
  尾.setUint32(0, 0x06054b50, true); 尾.setUint16(8, 檔案們.length, true); 尾.setUint16(10, 檔案們.length, true);
  尾.setUint32(12, 目錄大小, true); 尾.setUint32(16, 位移, true);
  const 全部 = 本地段.concat(目錄段, [new Uint8Array(尾.buffer)]);
  const 結果 = new Uint8Array(全部.reduce(function (s, b) { return s + b.length; }, 0));
  let p = 0;
  全部.forEach(function (b) { 結果.set(b, p); p += b.length; });
  return 結果;
}

// XML 文字跳脫（並移除 XML 不允許的控制字元）
function xml跳脫(s) {
  return esc(String(s == null ? "" : s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ""));
}

// 把二維陣列做成 xlsx 檔（第一列粗體當標題；數字存成數字，文字存成文字並防公式注入）
function 產生xlsx(列, 工作表名) {
  const 欄字 = function (i) { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const 列XML = 列.map(function (r, ri) {
    return '<row r="' + (ri + 1) + '">' + r.map(function (v, ci) {
      const 參照 = 欄字(ci) + (ri + 1);
      const 樣式 = ri === 0 ? ' s="1"' : "";
      if (typeof v === "number" && isFinite(v)) return '<c r="' + 參照 + '"' + 樣式 + "><v>" + v + "</v></c>";
      return '<c r="' + 參照 + '" t="inlineStr"' + 樣式 + "><is><t xml:space=\"preserve\">" + xml跳脫(防公式(v)) + "</t></is></c>";
    }).join("") + "</row>";
  }).join("");
  const 名 = xml跳脫(String(工作表名 || "工作表1").replace(/[\\/?*[\]:]/g, "").slice(0, 31) || "工作表1");
  const 檔案們 = [
    { 名: "[Content_Types].xml", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { 名: "_rels/.rels", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { 名: "xl/workbook.xml", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + 名 + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { 名: "xl/_rels/workbook.xml.rels", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { 名: "xl/styles.xml", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft JhengHei"/></font><font><b/><sz val="11"/><name val="Microsoft JhengHei"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf fontId="0"/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>' },
    { 名: "xl/worksheets/sheet1.xml", 內容: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + 列XML + "</sheetData></worksheet>" }
  ];
  return 打包zip(檔案們);
}

// 匯出二維陣列：格式 "csv" 或 "xlsx"
function 匯出表格(檔名, 列, 格式) {
  if (格式 === "xlsx") {
    下載檔案(檔名 + ".xlsx", new Blob([產生xlsx(列, 檔名)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  } else {
    下載檔案(檔名 + ".csv", 轉CSV(列), "text/csv;charset=utf-8");
  }
}

      { 代碼: "5108", 名稱: "雜支", 類別: "支出" },
      { 代碼: "5109", 名稱: "提撥基金", 類別: "支出" }
    ],
    // 官網「權益專區」的相關法規連結（在「官網發布 → 協會簡介」填寫；本系統本身不連任何網址）
    法規連結: [],
    備份份數: 30,
    範例資料: false,
    建立時間: 時間, 修改時間: 時間, 修改人: "系統"
  };
}

// 補齊舊資料檔缺少的集合與設定欄位（升級相容）
function 補齊資料(資料) {
  if (!資料 || 資料.格式 !== "協會資料") throw new Error("這不是協會資料檔");
  集合清單.forEach(function (名) { if (!Array.isArray(資料[名])) 資料[名] = []; });
  const 預設 = 預設設定("", 現在());
  資料.設定 = Object.assign({}, 預設, 資料.設定 || {});
  return 資料;
}

// ===== 資料夾模式 =====

// 讓使用者選協會資料夾，讀入協會資料.json（沒有就回傳 null，表示要建立新的）
async function 選擇資料夾() {
  const 夾 = await window.showDirectoryPicker({ id: "協會資料夾", mode: "readwrite" });
  if (夾.requestPermission) {
    const 權 = await 夾.requestPermission({ mode: "readwrite" });
    if (權 !== "granted") throw new Error("沒有取得資料夾的讀寫權限");
  }
  狀態.資料夾 = 夾;
  狀態.模式 = "資料夾";
  return 讀資料夾內資料();
}

// 讀資料夾裡的協會資料.json；檔案不存在回傳 null
async function 讀資料夾內資料() {
  let 檔;
  try {
    檔 = await 狀態.資料夾.getFileHandle(資料檔名);
  } catch (e) {
    return null;
  }
  const f = await 檔.getFile();
  if (!f.size) return null;
  const 資料 = 補齊資料(JSON.parse(await f.text()));
  狀態.檔案時間 = f.lastModified;
  return 資料;
}

// 取得（必要時建立）子資料夾，例如 取子資料夾(["附件","活動"])
async function 取子資料夾(路徑們, 建立) {
  let 夾 = 狀態.資料夾;
  for (const 名 of 路徑們) 夾 = await 夾.getDirectoryHandle(名, { create: 建立 !== false });
  return 夾;
}

// 寫一個檔案到指定資料夾
async function 寫檔(夾, 檔名, 內容) {
  const 檔 = await 夾.getFileHandle(檔名, { create: true });
  const 寫 = await 檔.createWritable();
  await 寫.write(內容);
  await 寫.close();
  return 檔;
}

// 存檔前備份：把磁碟上目前的協會資料.json 複製到 備份/，只保留最近 N 份
async function 備份(目前文字) {
  const 夾 = await 取子資料夾(["備份"]);
  const d = new Date();
  const 時戳 = d.getFullYear() + 補零(d.getMonth() + 1) + 補零(d.getDate()) + "-" + 補零(d.getHours()) + 補零(d.getMinutes()) + 補零(d.getSeconds()) + "-" + 補零(d.getMilliseconds(), 3);
  await 寫檔(夾, "協會資料_" + 時戳 + ".json", 目前文字);
  const 名單 = [];
  for await (const [名, 項] of 夾.entries()) {
    if (項.kind === "file" && /^協會資料_\d{8}-\d{6}(-\d{3})?\.json$/.test(名)) 名單.push(名);
  }
  名單.sort().reverse();
  const 保留 = Math.max(1, Number(狀態.資料.設定.備份份數) || 30);
  for (const 名 of 名單.slice(保留)) await 夾.removeEntry(名);
}

// 存檔：若別人在這段期間存過，先讀入並合併；備份後寫入
async function 存檔() {
  if (!狀態.資料) return false;
  if (狀態.模式 === "單檔") return 下載資料檔();
  const 檔 = await 狀態.資料夾.getFileHandle(資料檔名, { create: true });
  const 磁碟檔 = await 檔.getFile();
  let 磁碟文字 = 磁碟檔.size ? await 磁碟檔.text() : "";
  if (磁碟檔.size && 磁碟檔.lastModified !== 狀態.檔案時間) {
    // 別人存過：以每筆紀錄的修改時間合併
    const 對方 = 補齊資料(JSON.parse(磁碟文字));
    const 結果 = 合併資料(狀態.基準, 狀態.資料, 對方);
    if (結果.衝突.length) {
      const 選擇 = await 衝突對話框(結果.衝突);
      if (!選擇) { 提示("已取消存檔，資料尚未寫入", true); return false; }
      套用衝突選擇(結果.資料, 結果.衝突, 選擇);
    }
    狀態.資料 = 結果.資料;
    if (狀態.使用者) 狀態.使用者 = 找("使用者", 狀態.使用者.id) || 狀態.使用者;
    提示("有其他人剛存過檔，已自動合併" + (結果.衝突.length ? "（含 " + 結果.衝突.length + " 筆衝突處理）" : ""));
  }
  if (磁碟文字) await 備份(磁碟文字);
  const 文字 = JSON.stringify(狀態.資料, null, 1);
  await 寫檔(狀態.資料夾, 資料檔名, 文字);
  const 新檔 = await (await 狀態.資料夾.getFileHandle(資料檔名)).getFile();
  狀態.檔案時間 = 新檔.lastModified;
  狀態.基準 = JSON.parse(文字);
  狀態.未存 = false;
  更新存檔狀態();
  if (typeof 重新繪製 === "function") 重新繪製();
  提示(磁碟文字 ? "已存檔（舊檔已自動備份）" : "已存檔");
  return true;
}

// ===== 合併 =====

// 三方合併：基準（上次讀入）、我的（目前編輯）、對方（磁碟上別人存的），以每筆紀錄的修改時間判斷
function 合併資料(基準, 我的, 對方) {
  基準 = 基準 || { 設定: {} };
  const 結果 = 深拷貝(對方);
  const 衝突 = [];
  // 判斷一筆紀錄跟基準比有沒有變（新增、刪除或修改時間不同）
  const 變了 = function (b, x) {
    if (!b && !x) return false;
    if (!b || !x) return true;
    return b.修改時間 !== x.修改時間;
  };
  集合清單.forEach(function (名) {
    const B = 依編號(基準[名]), M = 依編號(我的[名]), T = 依編號(對方[名]);
    const 全部 = new Set(Object.keys(B).concat(Object.keys(M), Object.keys(T)));
    const 輸出 = [];
    // 保持對方的順序，再接上我新增的
    const 順序 = (對方[名] || []).map(function (r) { return r.id; });
    (我的[名] || []).forEach(function (r) { if (順序.indexOf(r.id) < 0) 順序.push(r.id); });
    全部.forEach(function (id) { if (順序.indexOf(id) < 0) 順序.push(id); });
    順序.forEach(function (id) {
      const b = B[id], m = M[id], t = T[id];
      const 我改 = 變了(b, m), 他改 = 變了(b, t);
      let 採用;
      if (!我改) 採用 = t;
      else if (!他改) 採用 = m;
      else if (m && t && JSON.stringify(m) === JSON.stringify(t)) 採用 = t;
      else if (名 === "操作紀錄") 採用 = m || t;
      else {
        衝突.push({ 集合: 名, id: id, 我的: m || null, 對方: t || null });
        採用 = 較新(m, t);
      }
      if (採用) 輸出.push(深拷貝(採用));
    });
    if (名 === "操作紀錄") 輸出.sort(function (a, b) { return String(a.時間).localeCompare(String(b.時間)); });
    結果[名] = 輸出;
  });
  // 設定是單一物件，用同樣規則
  const b = 基準.設定, m = 我的.設定, t = 對方.設定;
  const 我改 = 變了(b, m), 他改 = 變了(b, t);
  if (我改 && !他改) 結果.設定 = 深拷貝(m);
  else if (我改 && 他改 && JSON.stringify(m) !== JSON.stringify(t)) {
    衝突.push({ 集合: "設定", id: "設定", 我的: m, 對方: t });
    結果.設定 = 深拷貝(較新(m, t));
  }
  return { 資料: 結果, 衝突: 衝突 };
}

// 把陣列轉成 {id: 紀錄}
function 依編號(清單) {
  const o = {};
  (清單 || []).forEach(function (r) { if (r && r.id) o[r.id] = r; });
  return o;
}

// 兩筆紀錄取修改時間較新的（被刪除的算最舊）
function 較新(a, b) {
  if (!a) return b;
  if (!b) return a;
  return String(a.修改時間) >= String(b.修改時間) ? a : b;
}

// 衝突對照對話框：每筆衝突列出兩邊不同的欄位，讓使用者選保留哪一邊；回傳 {索引: "我的"|"對方"} 或 null
async function 衝突對話框(衝突們) {
  const 區 = h("div", null,
    h("p", null, "您和其他人同時修改了下列資料（只列出兩邊不同的欄位）。請逐筆選擇要保留哪一個版本（預設已選修改時間較新的）。"));
  衝突們.forEach(function (c, i) {
    const 欄位 = new Set(Object.keys(c.我的 || {}).concat(Object.keys(c.對方 || {})));
    const 列 = [];
    // 只列出兩邊不同的欄位（修改時間以民國年顯示）
    欄位.forEach(function (k) {
      if (k === "id" || k === "建立時間" || k === "鹽" || k === "雜湊") return;
      const 轉 = function (r) { return r ? (k === "修改時間" ? 民國時間(r[k]) : 顯示值(r[k])) : "（已刪除）"; };
      const a = 轉(c.我的), b = 轉(c.對方);
      if (a !== b) 列.push(h("tr", { class: "不同" }, h("th", null, k), h("td", null, a), h("td", null, b)));
    });
    const 預設對方 = 較新(c.我的, c.對方) === c.對方;
    區.appendChild(h("div", { class: "衝突", dataset: { index: i } },
      h("h3", null, 紀錄名稱(c.集合, c.我的 || c.對方 || {})),
      h("div", { class: "表捲" }, h("table", { class: "表" },
        h("thead", null, h("tr", null, h("th", null, "欄位"), h("th", null, "我的版本"), h("th", null, "其他人的版本"))),
        h("tbody", null, 列))),
      h("div", { class: "標籤組" },
        h("label", null, h("input", { type: "radio", name: "衝突" + i, value: "我的", checked: !預設對方 }), "保留我的版本"),
        h("label", null, h("input", { type: "radio", name: "衝突" + i, value: "對方", checked: 預設對方 }), "採用其他人的版本"))));
  });
  return 對話框("資料衝突", 區, [
    { 文字: "取消存檔", 值: null },
    {
      文字: "依選擇合併並存檔", 主: true, 動作: function () {
        const 選 = {};
        衝突們.forEach(function (c, i) { 選[i] = 區.querySelector('input[name="衝突' + i + '"]:checked').value; });
        return 選;
      }
    }
  ], { 寬: true });
}

// 依使用者的選擇修正合併結果
function 套用衝突選擇(資料, 衝突們, 選擇) {
  衝突們.forEach(function (c, i) {
    const 要的 = 選擇[i] === "我的" ? c.我的 : c.對方;
    if (c.集合 === "設定") { if (要的) 資料.設定 = 深拷貝(要的); return; }
    const 清單 = 資料[c.集合];
    const 位 = 清單.findIndex(function (r) { return r.id === c.id; });
    if (要的) { if (位 >= 0) 清單[位] = 深拷貝(要的); else 清單.push(深拷貝(要的)); }
    else if (位 >= 0) 清單.splice(位, 1);
  });
}

// ===== 附件 =====

// 把檔案存到 附件/子路徑/，檔名前加短編號避免重複；回傳相對路徑（附件/…/檔名）
async function 存附件(子路徑們, 檔案) {
  if (狀態.模式 !== "資料夾") throw new Error("單檔模式無法存附件，請改用支援資料夾功能的 Edge 瀏覽器");
  const 夾 = await 取子資料夾(["附件"].concat(子路徑們));
  const 安全名 = 檔案.name.replace(/[\\/:*?"<>|]/g, "_");
  const 名 = 新編號().slice(-6) + "_" + 安全名;
  await 寫檔(夾, 名, 檔案);
  return ["附件"].concat(子路徑們, [名]).join("/");
}

// 依相對路徑讀附件，回傳 File；找不到回傳 null
async function 讀附件(路徑) {
  if (狀態.模式 !== "資料夾" || !路徑) return null;
  try {
    const 段 = 路徑.split("/");
    const 夾 = await 取子資料夾(段.slice(0, -1), false);
    const f = await (await 夾.getFileHandle(段[段.length - 1])).getFile();
    // 有些環境讀出的檔案沒有類型，依副檔名補上（圖片才顯示得出來）
    return f.type ? f : new File([f], f.name, { type: 副檔名類型(f.name), lastModified: f.lastModified });
  } catch (e) {
    return null;
  }
}

// 依副檔名猜檔案類型
function 副檔名類型(檔名) {
  const 副 = String(檔名).split(".").pop().toLowerCase();
  return { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml",
    pdf: "application/pdf", txt: "text/plain", csv: "text/csv", json: "application/json" }[副] || "application/octet-stream";
}

// 刪除附件檔（找不到就略過）
async function 刪附件(路徑) {
  if (狀態.模式 !== "資料夾" || !路徑) return;
  try {
    const 段 = 路徑.split("/");
    const 夾 = await 取子資料夾(段.slice(0, -1), false);
    await 夾.removeEntry(段[段.length - 1]);
  } catch (e) { /* 檔案已不存在 */ }
}

// ===== 單檔模式（瀏覽器不支援資料夾功能時）=====

// 讓使用者選一個協會資料.json 檔讀入
async function 開啟資料檔() {
  const f = (await 選擇檔案(".json,application/json"))[0];
  if (!f) return undefined;
  const 資料 = 補齊資料(JSON.parse(await f.text()));
  狀態.模式 = "單檔";
  狀態.檔名 = f.name;
  return 資料;
}

// 單檔模式存檔：下載整份資料檔，請使用者放回原位置
function 下載資料檔() {
  const 文字 = JSON.stringify(狀態.資料, null, 1);
  下載檔案(資料檔名, 文字, "application/json");
  狀態.基準 = JSON.parse(文字);
  狀態.未存 = false;
  更新存檔狀態();
  提示("已下載資料檔，請放回協會資料夾覆蓋舊檔");
  return true;
}


/* ---------- 會務/04_登入.js ---------- */
// 檔案說明：開始畫面、第一次建立協會資料、登入（密碼以 PBKDF2 雜湊保存）、登出、改密碼

const 雜湊次數 = 310000;

// 位元組轉十六進位文字
function 轉十六進位(位元組) {
  return Array.from(new Uint8Array(位元組), function (b) { return 補零(b.toString(16)); }).join("");
}

// 十六進位文字轉位元組
function 十六進位轉位元組(hex) {
  const 結果 = new Uint8Array(hex.length / 2);
  for (let i = 0; i < 結果.length; i++) 結果[i] = parseInt(hex.substr(i * 2, 2), 16);
  return 結果;
}

// 用 PBKDF2（SHA-256）把密碼加鹽雜湊，回傳十六進位文字
async function 雜湊密碼(密碼, 鹽hex, 次數) {
  const 金鑰 = await crypto.subtle.importKey("raw", new TextEncoder().encode(密碼), "PBKDF2", false, ["deriveBits"]);
  const 位元 = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: 十六進位轉位元組(鹽hex), iterations: 次數, hash: "SHA-256" }, 金鑰, 256);
  return 轉十六進位(位元);
}

// 為一個密碼產生新的鹽與雜湊值（存進使用者紀錄）
async function 產生密碼紀錄(密碼) {
  const 鹽 = new Uint8Array(16);
  crypto.getRandomValues(鹽);
  const 鹽hex = 轉十六進位(鹽);
  return { 鹽: 鹽hex, 次數: 雜湊次數, 雜湊: await 雜湊密碼(密碼, 鹽hex, 雜湊次數) };
}

// 檢查密碼是否正確
async function 驗證密碼(使用者, 密碼) {
  if (!使用者 || !使用者.鹽 || !使用者.雜湊) return false;
  const 算出 = await 雜湊密碼(密碼, 使用者.鹽, 使用者.次數 || 雜湊次數);
  // 逐字比對全部字元，避免因比對時間不同洩漏資訊
  let 差 = 算出.length ^ 使用者.雜湊.length;
  for (let i = 0; i < 算出.length; i++) 差 |= 算出.charCodeAt(i) ^ (使用者.雜湊.charCodeAt(i) || 0);
  return 差 === 0;
}

// 密碼強度檢查：至少 8 個字元；回傳錯誤訊息或空字串
function 檢查密碼(密碼, 再次) {
  if (String(密碼).length < 8) return "密碼至少要 8 個字元";
  if (再次 != null && 密碼 !== 再次) return "兩次輸入的密碼不一樣";
  return "";
}

// 顯示開始畫面：選協會資料夾（或不支援時開啟資料檔）
function 顯示開始畫面() {
  狀態.資料 = null;
  狀態.使用者 = null;
  更新外框();
  const 內容 = 清空(document.getElementById("內容"));
  const 區 = h("div", { class: "歡迎" },
    h("img", { class: "會徽大", src: 會徽網址(), alt: "協會會徽" }),
    h("h1", null, "會務管理系統"),
    h("p", { class: "置中 次要字" }, "版本 " + 版本 + "　｜　完全離線，資料只存在您選的資料夾"));
  const 卡 = h("div", { class: "卡" });
  if (支援資料夾()) {
    卡.appendChild(h("h2", null, "開始使用"));
    卡.appendChild(h("p", null, "請選擇「協會資料夾」（例如共用磁碟上的 協會會務 資料夾）。系統會在裡面讀寫 協會資料.json、附件 與 備份 資料夾。"));

// 按下「選擇協會資料夾」
async function 按選資料夾() {
  try {
    const 資料 = await 選擇資料夾();
    if (資料) 載入資料(資料);
    else 建立新協會(狀態.資料夾);

}

// 第一次使用：建立新的協會資料（協會名稱＋第一位管理者）
function 建立新協會(夾) {
  const 內容 = 清空(document.getElementById("內容"));
  const 欄位們 = [
    { key: "協會名稱", 標題: "協會名稱", 必填: true, 預設: "財政部公務人員協會", 寬: true },
    { key: "姓名", 標題: "您的姓名", 必填: true },
    { key: "角色", 標題: "您的角色", 類型: "選單", 選項: ["理事長", "秘書長"], 必填: true, 預設: "秘書長" },
    { key: "密碼", 標題: "密碼（至少 8 個字元）", 類型: "密碼", 必填: true },
    { key: "再次", 標題: "再輸入一次密碼", 類型: "密碼", 必填: true }
  ];
  const 表單 = h("form", { class: "表單", onsubmit: function (e) { e.preventDefault(); } }, 欄位們.map(function (f) { return 表單欄位(f, f.預設); }));
  const 錯誤區 = h("p", { class: "錯誤", role: "alert" });
  const 送出 = async function () {
    const 值 = 讀表單(表單, 欄位們);
    if (!值.協會名稱 || !值.姓名) { 錯誤區.textContent = "請填寫協會名稱與姓名"; return; }
    const 錯 = 檢查密碼(值.密碼, 值.再次);
    if (錯) { 錯誤區.textContent = 錯; return; }
    const 資料 = 空白資料(值.協會名稱);
    狀態.資料 = 資料;
    狀態.基準 = null;
    const 密 = await 產生密碼紀錄(值.密碼);
    const 使用者 = 新增紀錄("使用者", Object.assign({ 姓名: 值.姓名, 角色: 值.角色, 停用: false }, 密));
    狀態.使用者 = 使用者;
    記錄操作("建立", "協會資料", "建立新的協會資料檔");
    if (夾) {
      狀態.基準 = { 設定: {} };
      await 存檔();
    } else {
      狀態.模式 = "單檔";
      標記未存();
    }
    登入完成(使用者);
  };
  內容.appendChild(h("div", { class: "歡迎" },
    h("img", { class: "會徽大", src: 會徽網址(), alt: "協會會徽" }),
    h("h1", null, "建立協會資料"),
    h("div", { class: "卡" },
      h("p", null, 夾 ? "這個資料夾還沒有協會資料，請先建立第一位管理者。" : "建立新的協會資料檔（存檔時會下載）。"),
      表單, 錯誤區,
      h("button", { class: "鈕 主", type: "button", id: "建立鈕", onclick: 送出 }, "建立並登入"))));
}

// 顯示登入畫面：選自己的名字＋輸入密碼
function 顯示登入畫面() {
  更新外框();
  const 內容 = 清空(document.getElementById("內容"));
  const 使用者們 = 集合("使用者").filter(function (u) { return !u.停用; })
    .sort(function (a, b) { return 比較(a.姓名, b.姓名); });
  const 選 = h("select", { id: "登入姓名" }, 使用者們.map(function (u) { return h("option", { value: u.id }, u.姓名 + "（" + u.角色 + "）"); }));
  const 密 = h("input", { type: "password", id: "登入密碼", autocomplete: "current-password" });
  const 錯誤區 = h("p", { class: "錯誤", role: "alert" });
  const 送出 = async function () {
    const u = 找("使用者", 選.value);
    錯誤區.textContent = "驗證中…";
    if (await 驗證密碼(u, 密.value)) {
      錯誤區.textContent = "";
      記錄操作("登入", "系統", u.姓名 + " 登入");
      登入完成(u);
    } else {
      錯誤區.textContent = "密碼不正確";
      密.select();
    }
  };
  密.addEventListener("keydown", function (e) { if (e.key === "Enter") 送出(); });
  內容.appendChild(h("div", { class: "歡迎" },
    h("img", { class: "會徽大", src: 會徽網址(), alt: "協會會徽" }),
    h("h1", null, 狀態.資料.設定.協會名稱),
    狀態.資料.設定.範例資料 ? h("p", { class: "範例條" }, "這是範例資料（人名、電話、Email、金額全部虛構）") : null,
    h("div", { class: "卡" },
      h("div", { class: "表單" },
        h("div", { class: "欄" }, h("span", null, h("label", { for: "登入姓名" }, "姓名")), 選),
        h("div", { class: "欄" }, h("span", null, h("label", { for: "登入密碼" }, "密碼")), 密)),
      錯誤區,
      h("div", { class: "表工具列" },
        h("button", { class: "鈕 主", type: "button", id: "登入鈕", onclick: 送出 }, "登入"),
        h("button", { class: "鈕 文字", type: "button", onclick: 顯示開始畫面 }, "換一個資料夾")))));

}

// 檔案說明：通用資料表元件（排序、篩選、搜尋、分頁、勾選批次動作、匯出 CSV／Excel）

// 建立資料表。設定：
//   欄位：[{key, 標題, 值(r), 顯示(r)→文字或元素, 數字:bool, 不排序:bool, 不匯出:bool}]
//   資料()：回傳要顯示的紀錄陣列
//   篩選：[{標題, 選項()→陣列, 取值(r)→值或值陣列}]
//   批次：[{文字, 動作(已選紀錄們)}]（有設定才顯示勾選欄）
//   點列(r)、工具(額外按鈕陣列)、匯出檔名、每頁（預設 20）、預設排序 {key, 反向}
function 資料表(設定) {
  const 狀 = { 搜尋: "", 篩選: {}, 排序: 設定.預設排序 ? 設定.預設排序.key : null, 反向: 設定.預設排序 ? !!設定.預設排序.反向 : false, 頁: 0, 已選: new Set() };
  const 每頁 = 設定.每頁 || 20;
  const 外框 = h("div", { class: "資料表" });
  const 搜尋框 = h("input", { type: "search", placeholder: "搜尋…", "aria-label": "搜尋", oninput: function () { 狀.搜尋 = 搜尋框.value.trim(); 狀.頁 = 0; 繪製(); } });
  const 篩選們 = (設定.篩選 || []).map(function (f, i) {
    const 選 = h("select", { "aria-label": f.標題, onchange: function () { 狀.篩選[i] = 選.value; 狀.頁 = 0; 繪製(); } },
      h("option", { value: "" }, "全部" + f.標題));
    選.addEventListener("focus", function () { 填篩選選項(選, f, i); });
    填篩選選項(選, f, i);
    return 選;
  });
  const 匯出名 = 設定.匯出檔名 || "匯出";
  const 工具列 = h("div", { class: "表工具列" }, 搜尋框, 篩選們,
    h("div", { class: "右側" }, 設定.工具 || [],
      設定.不匯出 ? null : h("button", { class: "鈕 小", type: "button", onclick: function () { 匯出(false, "csv"); } }, "匯出 CSV"),
      設定.不匯出 ? null : h("button", { class: "鈕 小", type: "button", onclick: function () { 匯出(false, "xlsx"); } }, "匯出 Excel")));
  const 批次列 = h("div", { class: "批次列 隱藏" });
  const 表區 = h("div", { class: "表捲" });
  const 分頁列 = h("div", { class: "分頁列" });
  外框.appendChild(工具列);
  外框.appendChild(批次列);
  外框.appendChild(表區);
  外框.appendChild(分頁列);

  // 填入篩選下拉選單的選項（保留目前選擇）
  function 填篩選選項(選, f, i) {
    const 目前 = 狀.篩選[i] || "";
    while (選.options.length > 1) 選.remove(1);
    (typeof f.選項 === "function" ? f.選項() : f.選項).forEach(function (o) { 選.appendChild(h("option", { value: o, selected: o === 目前 }, o)); });
  }

  // 取欄位的原始值（排序、匯出、搜尋用）
  function 原值(欄, r) {
    return 欄.值 ? 欄.值(r) : r[欄.key];
  }

  // 依搜尋與篩選條件過濾，再排序
  function 目前資料() {
    let 列 = 設定.資料().slice();
    if (狀.搜尋) {
      const 字 = 狀.搜尋.toLowerCase();
      列 = 列.filter(function (r) {
        return 設定.欄位.some(function (欄) { return String(顯示值(原值(欄, r))).toLowerCase().indexOf(字) >= 0; });
      });
    }
    (設定.篩選 || []).forEach(function (f, i) {
      const v = 狀.篩選[i];
      if (!v) return;
      列 = 列.filter(function (r) { const x = f.取值(r); return Array.isArray(x) ? x.indexOf(v) >= 0 : String(x) === v; });
    });
    if (狀.排序) {
      const 欄 = 設定.欄位.find(function (c) { return c.key === 狀.排序; });
      if (欄) 列.sort(function (a, b) { const c = 比較(原值(欄, a), 原值(欄, b)); return 狀.反向 ? -c : c; });
    }
    return 列;
  }

  // 重新畫出表格
  function 繪製() {
    const 列 = 目前資料();
    const 頁數 = Math.max(1, Math.ceil(列.length / 每頁));
    if (狀.頁 >= 頁數) 狀.頁 = 頁數 - 1;
    const 本頁 = 列.slice(狀.頁 * 每頁, 狀.頁 * 每頁 + 每頁);
    // 已選的只保留目前篩選結果裡看得到的（避免勾了看不到的資料還被批次處理）
    const 存在 = new Set(列.map(function (r) { return r.id; }));
    狀.已選.forEach(function (id) { if (!存在.has(id)) 狀.已選.delete(id); });
    const 有勾選 = !!(設定.批次 && 設定.批次.length);
    const 全選 = h("input", { type: "checkbox", "aria-label": "全選本頁", checked: 本頁.length > 0 && 本頁.every(function (r) { return 狀.已選.has(r.id); }),
      onchange: function () { 本頁.forEach(function (r) { if (全選.checked) 狀.已選.add(r.id); else 狀.已選.delete(r.id); }); 繪製(); } });
    const 表頭 = h("tr", null, 有勾選 ? h("th", { class: "勾" }, 全選) : null,
      設定.欄位.map(function (欄) {
        const 可排 = !欄.不排序;
        return h("th", {
          class: (可排 ? "可排序" : "") + (欄.數字 ? " 數" : ""),
          "aria-sort": 狀.排序 === 欄.key ? (狀.反向 ? "descending" : "ascending") : null,
          onclick: 可排 ? function () { if (狀.排序 === 欄.key) 狀.反向 = !狀.反向; else { 狀.排序 = 欄.key; 狀.反向 = false; } 繪製(); } : null
        }, 欄.標題);
      }));
    const 身 = h("tbody", null, 本頁.map(function (r) {
      const 勾 = 有勾選 ? h("td", { class: "勾", onclick: function (e) { e.stopPropagation(); } },
        h("input", { type: "checkbox", "aria-label": "勾選", checked: 狀.已選.has(r.id), onchange: function (e) { if (e.target.checked) 狀.已選.add(r.id); else 狀.已選.delete(r.id); 繪製(); } })) : null;
      return h("tr", { class: (設定.點列 ? "可點" : "") + (狀.已選.has(r.id) ? " 已選" : ""), dataset: { id: r.id }, onclick: 設定.點列 ? function () { 設定.點列(r); } : null },
        勾, 設定.欄位.map(function (欄) {
          const v = 欄.顯示 ? 欄.顯示(r) : 顯示值(原值(欄, r));
          return h("td", { class: 欄.數字 ? "數" : "" }, v);
        }));
    }));
    清空(表區).appendChild(h("table", { class: "表" }, h("thead", null, 表頭), 身));
    if (!列.length) 表區.appendChild(h("div", { class: "空" }, 設定.空白文字 || "沒有資料"));
    // 批次動作列
    清空(批次列);
    批次列.classList.toggle("隱藏", !(有勾選 && 狀.已選.size));
    if (有勾選 && 狀.已選.size) {
      批次列.appendChild(h("strong", null, "已勾選 " + 狀.已選.size + " 筆"));
      設定.批次.forEach(function (b) {
        批次列.appendChild(h("button", { class: "鈕 小", type: "button", onclick: function () { b.動作(已選紀錄()); } }, b.文字));
      });
      批次列.appendChild(h("button", { class: "鈕 小", type: "button", onclick: function () { 匯出(true, "csv"); } }, "匯出勾選"));
      批次列.appendChild(h("button", { class: "鈕 小 文字", type: "button", onclick: function () { 狀.已選.clear(); 繪製(); } }, "取消勾選"));
    }
    // 分頁
    清空(分頁列);
    分頁列.appendChild(h("span", { class: "次要字 小字" }, "共 " + 列.length + " 筆"));
    if (頁數 > 1) {
      分頁列.appendChild(h("button", { class: "鈕 小", type: "button", disabled: 狀.頁 === 0, onclick: function () { 狀.頁--; 繪製(); } }, "上一頁"));
      分頁列.appendChild(h("span", null, "第 " + (狀.頁 + 1) + " / " + 頁數 + " 頁"));
      分頁列.appendChild(h("button", { class: "鈕 小", type: "button", disabled: 狀.頁 >= 頁數 - 1, onclick: function () { 狀.頁++; 繪製(); } }, "下一頁"));
    }
  }

  // 取得目前勾選的紀錄（依目前排序）
  function 已選紀錄() {
    return 目前資料().filter(function (r) { return 狀.已選.has(r.id); });
  }

  // 匯出目前篩選結果（或只匯出勾選的）
  function 匯出(只勾選, 格式) {
    const 列 = 只勾選 ? 已選紀錄() : 目前資料();
    const 欄們 = 設定.欄位.filter(function (c) { return !c.不匯出; });
    const 表 = [欄們.map(function (c) { return c.標題; })].concat(列.map(function (r) {
      return 欄們.map(function (c) { const v = 原值(c, r); return typeof v === "number" ? v : 顯示值(v); });
    }));
    匯出表格(匯出名 + "_" + 今天(), 表, 格式);
  }

  繪製();
  return { 元素: 外框, 重繪: 繪製, 已選: 已選紀錄, 目前: 目前資料, 清除勾選: function () { 狀.已選.clear(); 繪製(); } };
}

// 計算某一天時的有效會員數（已入會、尚未退會）
function 某日會員數(日期) {
  return 集合("會員").filter(function (m) {
    if (!m.入會日期 || m.入會日期 > 日期) return false;
    if (m.退會日期 && m.退會日期 <= 日期) return false;
    return m.會籍狀態 !== "申請中";
  }).length;
}

// 取得某月份（YYYY-MM）的最後一天
function 月底(年月) {
  const [y, m] = 年月.split("-").map(Number);
  return 年月 + "-" + 補零(new Date(y, m, 0).getDate());
}

// 畫出首頁

    數字卡(民國年(年) + " 年度未繳常年會費", 未繳.length + " 人", "應收 " + 金額(未繳.length * (Number(設.會費標準.常年會費) || 0)) + " 元，前往催繳", "會費與帳務", { 頁籤: "催繳" }),
    數字卡("本月收入", 金額(本月收入) + " 元", "支出 " + 金額(本月支出) + " 元，結餘 " + 金額(本月收入 - 本月支出) + " 元", "會費與帳務", { 頁籤: "收支記帳" }),
    數字卡("近期活動", 近期.length + " 場", 近期[0] ? "最近：" + 近期[0].名稱 : "目前沒有排定的活動", "活動報名")));

  // 待我簽核、近期活動與會議
  const 活動清單 = h("ul", { class: "清單" }, 近期.length ? 近期.map(function (a) {
    const 正取 = 集合("報名").filter(function (r) { return r.活動id === a.id && r.狀態 === "正取"; }).length;
    return h("li", null, h("span", { class: "標記 金" }, 民國(a.日期)),

      h("span", { class: "次要字 小字", style: "margin-left:auto" }, "報名 " + 正取 + "／" + (a.名額 || "不限")));
  }) : h("li", { class: "次要字" }, "目前沒有排定的活動"));

  // 會員數變化（近 12 個月）
  const 月份們 = [];

}

// 產生下一個會員編號（M0001、M0002…）

// 新增一位會員並寫入「入會」異動（申請中的不寫）

  }

}

// 找可能重複的會員：員工編號相同、Email 相同、或姓名＋服務機關相同
function 找重複會員(值, 排除id) {
  const 小 = function (s) { return String(s || "").trim().toLowerCase(); };
  return 集合("會員").find(function (m) {
    if (m.id === 排除id) return false;
    if (值.員工編號 && 小(m.員工編號) === 小(值.員工編號)) return true;
    if (值.Email && 小(m.Email) === 小(值.Email)) return true;
    return 值.姓名 && m.姓名 === 值.姓名 && (m.服務機關 || "") === (值.服務機關 || "");
  }) || null;
}

// 列出名冊中出現過的入會年度（民國）

// 新增或編輯會員資料
function 編輯會員(id, 完成後) {
  const 原 = id ? 找("會員", id) : null;
  const 欄位們 = 會員欄位();
  return 表單對話框(原 ? "編輯會員：" + 原.姓名 : "新增會員", 欄位們, 原 || { 入會日期: 今天() }, function (值) {
    if (值.Email && !/^[^@\s]+@[^@\s]+$/.test(值.Email)) return "Email 格式不正確";
    const 重複 = 找重複會員(值, id);
    if (重複) return "可能與既有會員重複：" + 重複.會員編號 + " " + 重複.姓名 + "（" + (重複.服務機關 || "") + "）";
    if (原) {
      if (值.會籍狀態 === "退會" && 原.會籍狀態 !== "退會") 值.退會日期 = 今天();
      更新紀錄("會員", id, 值);

    提示("已儲存會員資料");
    if (完成後) 完成後();
  });

// 會員詳細資料：基本資料、異動歷程、會費紀錄、活動參與，以及辦理異動的按鈕
function 會員詳細(id, 完成後) {
  const m = 找("會員", id);
  if (!m) return;
  const 可編 = 可("會員.編輯");
  const 重整 = function () { if (完成後) 完成後(); };

  const 報名 = 集合("報名").filter(function (x) { return x.會員id === id; });
  const 小表 = function (標題們, 列們) {
    return 列們.length ? h("div", { class: "表捲" }, h("table", { class: "表" }, h("thead", null, h("tr", null, 標題們.map(function (t) { return h("th", null, t); }))),

  };
  const 按鈕們 = [];
  if (可編) {
    按鈕們.push({ 文字: "編輯資料", 動作: function (關) { 關(null); 編輯會員(id, 重整); } });
    if (m.會籍狀態 === "申請中") 按鈕們.push({ 文字: "核准入會", 主: true, 動作: function (關) { 關(null); 核准入會([m], 重整); } });
    if (m.會籍狀態 === "有效") {
      按鈕們.push({ 文字: "辦理轉調", 動作: function (關) { 關(null); 辦理異動(m, "轉調", 重整); } });
      按鈕們.push({ 文字: "辦理退會", 危: true, 動作: function (關) { 關(null); 辦理異動(m, "退會", 重整); } });
    }
    if (m.會籍狀態 === "退會" || m.會籍狀態 === "停權") 按鈕們.push({ 文字: "辦理復會", 動作: function (關) { 關(null); 辦理異動(m, "復會", 重整); } });
    if (m.會籍狀態 === "申請中" || (!異動.length && !會費.length && !報名.length)) {
      按鈕們.push({ 文字: "刪除", 危: true, 動作: async function (關) {
        if (!(await 確認("確定刪除「" + m.姓名 + "」？（建議用「退會」保留紀錄；刪除後只剩操作紀錄）", "刪除"))) return false;
        刪除紀錄("會員", id); 關(null); 重整();
      } });
    }
  }
  按鈕們.push({ 文字: "關閉" });
  對話框(m.會員編號 + "　" + m.姓名, [
    基本,
    h("h3", null, "異動歷程"),
    小表(["日期", "類型", "說明", "原機關", "新機關", "經辦"], 異動.map(function (x) { return [民國(x.日期), x.類型, x.說明 || "", x.原機關 || "", x.新機關 || "", x.修改人 || ""]; })),
    h("h3", null, "會費紀錄"),
    小表(["年度", "項目", "金額", "繳費日", "收據號"], 會費.map(function (x) { return [民國年(x.年度), x.項目, 金額(x.金額), 民國(x.繳費日), x.收據號 || ""]; })),
    h("h3", null, "活動參與"),
    小表(["活動", "日期", "報名狀態", "簽到"], 報名.map(function (r) { const a = 找("活動", r.活動id) || {}; return [a.名稱 || "（已刪除）", 民國(a.日期), r.狀態, r.簽到時間 ? "已簽到" : "—"]; }))
  ], 按鈕們, { 寬: true });
}

// 辦理退會、轉調、復會：填日期與說明，寫入異動歷程並更新會員資料
function 辦理異動(m, 類型, 完成後) {
  const 設 = 狀態.資料.設定;
  const 欄位們 = [{ key: "日期", 標題: 類型 + "日期", 類型: "日期", 必填: true, 預設: 今天() }];
  if (類型 === "轉調") {
    欄位們.push({ key: "新機關", 標題: "轉調後服務機關", 類型: "選單", 選項: 設.服務機關, 必填: true });
    欄位們.push({ key: "新單位", 標題: "轉調後單位" });
    欄位們.push({ key: "新職稱", 標題: "轉調後職稱", 預設: m.職稱 });
  }
  欄位們.push({ key: "說明", 標題: "說明", 類型: "多行", 行數: 2 });
  return 表單對話框("辦理" + 類型 + "：" + m.姓名, 欄位們, {}, function (值) {
    const 異動 = { 會員id: m.id, 日期: 值.日期, 類型: 類型, 說明: 值.說明, 原機關: m.服務機關 || "" };
    if (類型 === "轉調") {
      異動.新機關 = 值.新機關;
      更新紀錄("會員", m.id, { 服務機關: 值.新機關, 單位: 值.新單位 || "", 職稱: 值.新職稱 || m.職稱 || "" }, "會員「" + m.姓名 + "」轉調");
    } else if (類型 === "退會") {
      更新紀錄("會員", m.id, { 會籍狀態: "退會", 退會日期: 值.日期 }, "會員「" + m.姓名 + "」退會");
    } else if (類型 === "復會") {
      異動.新機關 = m.服務機關 || "";
      更新紀錄("會員", m.id, { 會籍狀態: "有效", 退會日期: "" }, "會員「" + m.姓名 + "」復會");
    }
    新增紀錄("會員異動", 異動, "會員異動「" + m.姓名 + " " + 類型 + "」");
    提示("已辦理" + 類型);
    if (完成後) 完成後();
  });
}

// 依標題文字猜對應的會員欄位
function 猜欄位(標題) {
  const t = String(標題 || "").trim().toLowerCase();
  for (const k of Object.keys(匯入別名)) if (匯入別名[k].some(function (a) { return a.toLowerCase() === t; })) return k;

// 欄位對應對話框：每個檔案欄位選要對應到哪個會員欄位，並選重複時怎麼處理
function 匯入對應對話框(檔名, 列, 完成後) {
  const 標題列 = 列[0];
  const 資料列 = 列.slice(1);
  const 目標 = Object.keys(匯入別名);
  const 選單們 = 標題列.map(function (t, i) {
    const 猜 = 猜欄位(t);
    return h("select", { dataset: { col: i }, "aria-label": "欄位 " + t },
      h("option", { value: "" }, "（不匯入）"), 目標.map(function (k) { return h("option", { value: k, selected: k === 猜 }, k); }));
  });
  const 重複處理 = h("select", { id: "重複處理" }, h("option", { value: "略過" }, "略過（不動既有資料）"), h("option", { value: "更新" }, "以檔案內容更新既有資料"));
  const 預覽 = h("table", { class: "表" },
    h("thead", null, h("tr", null, 標題列.map(function (t, i) { return h("th", null, t || "（第 " + (i + 1) + " 欄）", h("br"), 選單們[i]); }))),
    h("tbody", null, 資料列.slice(0, 5).map(function (r) { return h("tr", null, 標題列.map(function (_, i) { return h("td", null, r[i] || ""); })); })));
  對話框("匯入名冊：" + 檔名, [
    h("p", null, "共 " + 資料列.length + " 筆。請確認每一欄要對應到哪個欄位（已自動猜測）。下方只預覽前 5 筆。"),
    h("div", { class: "表捲" }, 預覽),
    h("p", null, h("label", null, "遇到重複會員（員工編號、Email 或 姓名＋機關相同）時：", 重複處理))
  ], [{ 文字: "取消" }, {
    文字: "開始匯入", 主: true, 動作: function () {
      const 對應 = {};
      選單們.forEach(function (s, i) { if (s.value) 對應[s.value] = i; });
      if (對應.姓名 == null) { 提示("至少要對應「姓名」欄位", true); return false; }
      const 結果 = 執行匯入(資料列, 對應, 重複處理.value);
      對話框("匯入結果", h("ul", null,
        h("li", null, "新增 " + 結果.新增 + " 人"), h("li", null, "更新 " + 結果.更新 + " 人"),
        h("li", null, "略過重複 " + 結果.略過 + " 人"), h("li", null, "資料不完整（沒有姓名）" + 結果.錯誤 + " 筆"),
        結果.新機關.length ? h("li", null, "新的服務機關已加入設定清單：" + 結果.新機關.join("、")) : null,
        h("li", null, "記得按「存檔」")));
      if (完成後) 完成後();
      return true;
    }
  }], { 寬: true });
}

// 依欄位對應把每一列轉成會員資料並新增或更新；回傳統計
function 執行匯入(資料列, 對應, 重複處理) {
  const 設 = 狀態.資料.設定;
  const 統計 = { 新增: 0, 更新: 0, 略過: 0, 錯誤: 0, 新機關: [] };
  const 新機關們 = 統計.新機關;
  資料列.forEach(function (r) {
    const 值 = {};
    Object.keys(對應).forEach(function (k) { 值[k] = String(r[對應[k]] == null ? "" : r[對應[k]]).trim(); });
    if (!值.姓名) { 統計.錯誤++; return; }
    if ("入會日期" in 值) 值.入會日期 = 解析日期(值.入會日期);
    if ("標籤" in 值) 值.標籤 = 值.標籤.split(/[、,，;；\s]+/).filter(Boolean);
    if (值.會籍狀態 && 會籍狀態們.indexOf(值.會籍狀態) < 0) 值.會籍狀態 = "有效";
    if ("性別" in 值) 值.性別 = 轉性別(值.性別);
    if (值.服務機關 && 設.服務機關.indexOf(值.服務機關) < 0) {
      // 機關名稱不在清單：試著補上「財政部」前綴比對
      const 試 = 設.服務機關.find(function (o) { return o === "財政部" + 值.服務機關 || o.replace(/^財政部/, "") === 值.服務機關; });
      if (試) 值.服務機關 = 試;
      else if (新機關們.indexOf(值.服務機關) < 0) 新機關們.push(值.服務機關);
    }
    const 重複 = 找重複會員(值);
    if (重複) {
      if (重複處理 === "更新") {
        Object.keys(值).forEach(function (k) { if (值[k] === "" || (Array.isArray(值[k]) && !值[k].length)) delete 值[k]; });
        更新紀錄("會員", 重複.id, 值, "匯入更新「" + 重複.姓名 + "」");
        統計.更新++;
      } else 統計.略過++;
      return;
    }
    新增會員(Object.assign({ 會員類別: 設.會員類別[0], 會籍狀態: "有效", 入會日期: 今天(), 標籤: [] }, 值), "名冊匯入");
    統計.新增++;
  });
  // 名冊裡出現新的服務機關名稱：加進設定清單，篩選與下拉選單才找得到
  if (新機關們.length) 更新設定({ 服務機關: 設.服務機關.concat(新機關們) });
  記錄操作("匯入", "會員", "新增 " + 統計.新增 + "、更新 " + 統計.更新 + "、略過 " + 統計.略過);
  return 統計;
}

// 把名冊裡的性別寫法轉成「女／男」：0、女、F → 女；1、男、M → 男；其他留空
function 轉性別(v) {
  const s = String(v == null ? "" : v).trim().toUpperCase();
  if (s === "0" || s === "女" || s === "F") return "女";
  if (s === "1" || s === "男" || s === "M") return "男";
  return "";
}

// 標準名冊格式的欄位（匯入範本與「匯出名冊（標準格式）」共用）

// 把會員轉成標準名冊的一列（性別：女→0、男→1）

}

// 匯出標準格式名冊（姓名、女0男1、服務機關、服務單位、職稱、電子郵件信箱），可選 Excel 或 CSV
async function 匯出標準名冊(列) {

    h("p", null, "欄位：" + 標準名冊欄位.join("、") + "。共 " + 列.length + " 人（依目前的搜尋與篩選條件）。"),
    h("p", { class: "提醒" }, "名冊含個人資料，請只在協會幹部之間傳遞，用畢刪除，不要放到公開網站。")
  ], [{ 文字: "取消" }, { 文字: "CSV", 值: "csv" }, { 文字: "Excel", 主: true, 值: "xlsx" }]);
  if (!格式) return;
  匯出表格("會員名冊_" + 今天(), [標準名冊欄位].concat(列.map(標準名冊列)), 格式);
  記錄操作("匯出", "會員", "匯出標準格式名冊 " + 列.length + " 人");
}

// 匯入官網產生的入會申請資料檔（可一次選多個），建立「申請中」的會員
function 匯入入會申請(完成後) {
  選擇檔案(".json", true).then(async function (檔們) {
    if (!檔們.length) return;
    let 新增 = 0, 重複 = 0, 錯誤 = 0;
    for (const f of 檔們) {
      try {
        const j = JSON.parse(await f.text());
        if (j.格式 !== "協會申請資料" || j.類型 !== "入會申請" || !j.資料 || !j.資料.姓名) { 錯誤++; continue; }
        const d = j.資料;
        const 值 = { 姓名: d.姓名, 性別: 轉性別(d.性別), 員工編號: d.員工編號 || "", 服務機關: d.服務機關 || "", 單位: d.單位 || "", 職稱: d.職稱 || "",
          公務電話: d.公務電話 || "", Email: d.Email || "", 會員類別: 狀態.資料.設定.會員類別[0], 會籍狀態: "申請中",
          申請日期: String(j.申請時間 || "").slice(0, 10), 備註: d.備註 || "", 來源: "官網入會申請", 標籤: ["新進"] };
        if (找重複會員(值)) { 重複++; continue; }
        新增會員(值);
        新增++;
      } catch (e) { 錯誤++; }
    }
    對話框("匯入入會申請", h("ul", null, h("li", null, "新增申請 " + 新增 + " 件（會籍狀態：申請中，請審核後按「核准入會」）"),
      h("li", null, "與既有會員重複 " + 重複 + " 件（未匯入）"), h("li", null, "不是入會申請檔 " + 錯誤 + " 件")));
    if (完成後) 完成後();
  });
}

// 檔案說明：會費與帳務（常年會費逐人收繳、催繳名單與通知單、收據列印、收支記帳與傳票、收支決算表）

註冊頁面("會費與帳務", {
  圖示: "＄",
  可見: function () { return 可("帳務.檢視"); },
