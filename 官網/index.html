<style>
/* 共用主題：官網與會務系統共用的配色（深藍＋金）、深淺色、基本元件樣式 */

/* 淺色（預設）配色 */
:root {
  --navy: #2a2854;
  --gold: #c6951c;
  --gold-soft: #f3e7c6;
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #eeedf4;
  --text: #1d1c2b;
  --muted: #5d5c70;
  --line: #d9d7e3;
  --brand: #2a2854;
  --brand-text: #ffffff;
  --link: #2f2c8f;
  --danger: #b42318;
  --danger-soft: #fde8e6;
  --ok: #1f7a4d;
  --ok-soft: #e3f4ea;
  --warn: #9a6400;
  --warn-soft: #fdf1d8;
  --focus: #c6951c;
  --shadow: 0 1px 2px rgba(20, 18, 50, .08), 0 4px 14px rgba(20, 18, 50, .06);
  --radius: 10px;
  --font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
  --font-kai: "DFKai-SB", "標楷體", "BiauKai", "TW-Kai", serif;
  color-scheme: light;
}

/* 深色配色：系統偏好深色、且使用者沒有手動選淺色時 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gold: #d9aa3a;
    --gold-soft: #3b3220;
    --bg: #131226;
    --surface: #1d1c36;
    --surface-2: #26254a;
    --text: #ecebf5;
    --muted: #aeadc6;
    --line: #36355e;
    --brand: #3b3880;
    --link: #b9b6ff;
    --danger: #ff8a7a;
    --danger-soft: #3d1d1d;
    --ok: #6fd6a0;
    --ok-soft: #173326;
    --warn: #f0c060;
    --warn-soft: #3a2f16;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}

/* 深色配色：使用者手動切成深色時 */
:root[data-theme="dark"] {
  --gold: #d9aa3a;
  --gold-soft: #3b3220;
  --bg: #131226;
  --surface: #1d1c36;
  --surface-2: #26254a;
  --text: #ecebf5;
  --muted: #aeadc6;
  --line: #36355e;
  --brand: #3b3880;
  --link: #b9b6ff;
  --danger: #ff8a7a;
  --danger-soft: #3d1d1d;
  --ok: #6fd6a0;
  --ok-soft: #173326;
  --warn: #f0c060;
  --warn-soft: #3a2f16;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* 基本版面 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--link); }
img { max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 .6em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.隱藏 { display: none !important; }
.次要字 { color: var(--muted); }
.小字 { font-size: .875rem; }
.右 { text-align: right; }
.置中 { text-align: center; }
.不換行 { white-space: nowrap; }

/* 按鈕 */
.鈕 {
  display: inline-flex; align-items: center; justify-content: center; gap: .35em;
  min-height: 38px; padding: .4em 1em;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font: inherit; font-size: .95rem; cursor: pointer; text-decoration: none;
}
.鈕:hover { border-color: var(--gold); }
.鈕:disabled { opacity: .5; cursor: not-allowed; }
.鈕.主 { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
.鈕.金 { background: var(--gold); color: #1d1c2b; border-color: var(--gold); }
.鈕.危 { color: var(--danger); border-color: var(--danger); }
.鈕.小 { min-height: 30px; padding: .15em .65em; font-size: .85rem; }
.鈕.文字 { border-color: transparent; background: transparent; color: var(--link); }

/* 輸入欄位 */
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: .45em .6em; min-height: 38px;
  max-width: 100%;
}
textarea { min-height: 6em; width: 100%; resize: vertical; }
input[type="checkbox"], input[type="radio"] { min-height: 0; width: 1.1em; height: 1.1em; accent-color: var(--brand); }
label { cursor: pointer; }

/* 卡片 */
.卡 {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.2rem;
}

/* 標記（狀態小方塊） */
.標記 {
  display: inline-block; padding: 0 .55em; border-radius: 999px;
  font-size: .8rem; line-height: 1.7; background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}
.標記.成 { background: var(--ok-soft); color: var(--ok); }
.標記.危 { background: var(--danger-soft); color: var(--danger); }
.標記.警 { background: var(--warn-soft); color: var(--warn); }
.標記.金 { background: var(--gold-soft); color: var(--warn); }

/* 範例資料提示條 */
.範例條 {
  background: repeating-linear-gradient(-45deg, var(--warn-soft), var(--warn-soft) 10px, transparent 10px, transparent 20px);
  color: var(--warn); border: 1px dashed var(--warn); border-radius: 8px;
  padding: .3em .8em; font-size: .85rem; text-align: center;
}

/* 表格 */
.表 { width: 100%; border-collapse: collapse; font-size: .93rem; }
.表 th, .表 td { padding: .5em .6em; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.表 th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.表 td.數, .表 th.數 { text-align: right; font-variant-numeric: tabular-nums; }
.表捲 { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* 官網版面：站頭選單、首頁主視覺、卡片、列表、表單、組織圖、手機版、列印申請書 */

.寬度 { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.跳至內容 { position: absolute; left: -9999px; top: 0; background: var(--gold); color: #000; padding: .5em 1em; z-index: 100; }
.跳至內容:focus { left: 8px; top: 8px; }

/* 站頭 */
.站頭 { background: var(--navy); color: #fff; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 20; }
.站頭列 { display: flex; align-items: center; gap: 1rem; min-height: 68px; flex-wrap: wrap; }
.站名 { display: flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.15rem; min-width: 0; }
.站名 span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.主選單 { display: flex; gap: .1rem; margin-left: auto; flex-wrap: wrap; order: 2; }
.主題鈕 { order: 3; padding: .2em .6em !important; font-size: .85rem !important; white-space: nowrap; }
.主選單 a { color: #e9e8f7; text-decoration: none; padding: .45em .55em; border-radius: 6px; font-size: .95rem; }
.主選單 a:hover { background: rgba(255,255,255,.1); color: #fff; }
.主選單 a[aria-current="page"] { color: #fff; box-shadow: inset 0 -3px 0 var(--gold); }
.站頭 .鈕 { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); min-height: 34px; }
.選單鈕 { display: none; order: 3; }

/* 內容 */
.內容 { padding-top: 1.6rem; padding-bottom: 3rem; min-height: 60vh; outline: none; }
.內容 > h1 { font-size: 1.7rem; border-left: 6px solid var(--gold); padding-left: .6rem; }
.段 { margin-top: 2rem; }
.段 > h2 { font-size: 1.3rem; display: flex; align-items: baseline; gap: .6rem; }
.段 > h2 a { font-size: .9rem; font-weight: 400; margin-left: auto; }
.格 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.卡 h3 { margin-bottom: .3em; font-size: 1.1rem; }
.卡 p { margin: .3em 0; }
.日期 { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.內文 { white-space: pre-wrap; overflow-wrap: anywhere; }

/* 首頁主視覺 */
.主視覺 { background: linear-gradient(135deg, #2a2854 0%, #3c3a78 60%, #2a2854 100%); color: #fff; border-radius: 16px; padding: 2.4rem 1.6rem; display: flex; gap: 1.6rem; align-items: center; flex-wrap: wrap; border-bottom: 5px solid var(--gold); }
.主視覺 img { width: 110px; height: 110px; flex: none; }
.主視覺 h1 { font-size: 2rem; margin: 0 0 .2em; }
.主視覺 p { color: #e2e0f5; font-size: 1.1rem; margin: 0 0 1rem; }
.主視覺 .鈕 { margin: .2rem .4rem .2rem 0; }
.主視覺 .鈕:not(.金) { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }

/* 快速連結 */
.快速 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.快速 a { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; border-top: 4px solid var(--gold); box-shadow: var(--shadow); }
.快速 a strong { display: block; font-size: 1.1rem; }
.快速 a span { color: var(--muted); font-size: .9rem; }
.快速 a:hover { border-color: var(--gold); }

/* 消息列表 */
.消息列 { list-style: none; margin: 0; padding: 0; }
.消息列 li { display: flex; gap: .8rem; align-items: baseline; padding: .7rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.消息列 li a { font-weight: 600; flex: 1 1 260px; overflow-wrap: anywhere; }
.分類鈕 { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.分類鈕 button[aria-pressed="true"] { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }

/* 組織架構圖 */
.組織圖 { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
.組織圖 .層 { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; position: relative; }
.組織圖 .節點 { background: var(--surface); border: 2px solid var(--navy); border-radius: 10px; padding: .45em 1em; font-weight: 600; text-align: center; }
:root[data-theme="dark"] .組織圖 .節點 { border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .組織圖 .節點 { border-color: var(--gold); } }
.組織圖 .節點.頂 { background: var(--navy); color: #fff; }
.組織圖 .線 { width: 2px; height: 16px; background: var(--gold); }
.組織圖 .節點.小 { font-weight: 400; font-size: .92rem; border-width: 1px; }

/* 問答 */
details.問答 { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .2rem 1rem; margin-bottom: .6rem; }
details.問答 summary { cursor: pointer; font-weight: 600; padding: .6rem 0; }
details.問答[open] summary { border-bottom: 1px dashed var(--line); margin-bottom: .5rem; }

/* 表單 */
.表單 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .8rem 1rem; }
.表單 .欄 { display: flex; flex-direction: column; gap: .25rem; }
.表單 .欄.寬 { grid-column: 1 / -1; }
.表單 .欄 > label { font-size: .9rem; color: var(--muted); }
.表單 .必填::after { content: " *"; color: var(--danger); }
.錯誤 { color: var(--danger); }
.完成訊息 { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: .8rem 1rem; }

/* 照片 */
.相片牆 { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .6rem; }
.相片牆 img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }

/* 站尾 */
.站尾 { background: var(--navy); color: #d6d4ee; padding: 1.6rem 0; font-size: .9rem; border-top: 4px solid var(--gold); }
.站尾 a { color: #fff; }
.站尾 strong { color: #fff; }

/* 手機版 */
@media (max-width: 900px) {
  .選單鈕 { display: inline-flex; }
  .主選單 { display: none; width: 100%; flex-direction: column; padding-bottom: .6rem; order: 4; }
  .主選單.開 { display: flex; }
  .主選單 a { padding: .6em .4em; border-bottom: 1px solid rgba(255,255,255,.1); }
  .主題鈕 { margin-left: auto; }
  .站頭列 { gap: .5rem; }
  .主視覺 { padding: 1.6rem 1.1rem; }
  .主視覺 h1 { font-size: 1.5rem; }
  .主視覺 img { width: 72px; height: 72px; }
}

/* 列印入會申請書 */
.列印區 { display: none; }
@media print {
  @page { size: A4 portrait; margin: 18mm; }
  body { background: #fff; color: #000; }
  .站頭, .站尾, .內容, #範例條, .跳至內容 { display: none !important; }
  .列印區 { display: block; font-family: var(--font-kai); }
}
.申請書 h1 { text-align: center; font-size: 20pt; }
.申請書 table { width: 100%; border-collapse: collapse; }
.申請書 th, .申請書 td { border: 1px solid #000; padding: 3mm; text-align: left; font-size: 12pt; }
.申請書 th { width: 25%; background: #f2f2f2; }

</style>
</head>

<script>
/* ===== 程式分節 =====
 * （每一節對應 製作/src/ 裡的一支原始檔）

// 把文字裡的 HTML 特殊字元換成安全寫法，避免資料被當成程式碼執行
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// 檢查網址是否安全（只允許 http、https、mailto、tel、圖片 data:、blob: 與相對路徑），不安全就回傳 "#"
function 安全網址(url) {
  const s = String(url == null ? "" : url).trim();
  if (/^(https?:|mailto:|tel:|blob:|data:image\/)/i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return "#";
  return s;
}

// 建立一個畫面元素：h("div", {class:"x", onclick:函式}, "文字", 子元素…)；文字一律當純文字放入
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "value") el.value = v;
      else if (k === "checked" || k === "selected" || k === "disabled" || k === "multiple") el[k] = !!v;
      else if (k === "dataset") Object.assign(el.dataset, v);
      else if (k === "href" || k === "src") el.setAttribute(k, 安全網址(v));
      else el.setAttribute(k, v === true ? "" : v);
    }
  }
  加入子元素(el, Array.prototype.slice.call(arguments, 2));
  return el;
}

// 把子元素（文字、元素、陣列）依序加到父元素；文字會轉成純文字節點
function 加入子元素(el, kids) {
  for (const k of kids) {
    if (k == null || k === false) continue;
    if (Array.isArray(k)) { 加入子元素(el, k); continue; }
    el.appendChild(typeof k === "object" && k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}

// 清空一個元素裡的所有內容
function 清空(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

// 用安全方式把一段（已跳脫的）HTML 字串轉成元素片段：template.innerHTML → content
function 轉片段(html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  return t.content;
}

// 兩位數補零
function 補零(n, 位數) {
  return String(n).padStart(位數 || 2, "0");
}

// 取得今天日期（本機時間），格式 2026-10-07
function 今天() {
  const d = new Date();
  return d.getFullYear() + "-" + 補零(d.getMonth() + 1) + "-" + 補零(d.getDate());
}

// 取得現在時間（ISO 格式，含時區），用來記錄修改時間
function 現在() {
  return new Date().toISOString();
}

// 把 2026-10-07 這種日期轉成民國 115/10/07；空值回傳空字串
function 民國(日期) {
  if (!日期) return "";
  const m = String(日期).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(日期);
  return (Number(m[1]) - 1911) + "/" + m[2] + "/" + m[3];
}

// 把 ISO 時間轉成民國年月日＋時分，例：115/10/07 14:05
function 民國時間(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return (d.getFullYear() - 1911) + "/" + 補零(d.getMonth() + 1) + "/" + 補零(d.getDate()) + " " + 補零(d.getHours()) + ":" + 補零(d.getMinutes());
}

// 西元年轉民國年
function 民國年(西元年) {
  return Number(西元年) - 1911;
}

// 把民國日期（115/1/7、115.01.07、1150107）或西元日期轉成 2026-01-07；看不懂回傳空字串
function 解析日期(s) {
  s = String(s == null ? "" : s).trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if (m) return m[1] + "-" + 補零(m[2]) + "-" + 補零(m[3]);
  m = s.match(/^(\d{2,3})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if (m) return (Number(m[1]) + 1911) + "-" + 補零(m[2]) + "-" + 補零(m[3]);
  m = s.match(/^(\d{3})(\d{2})(\d{2})$/);
  if (m) return (Number(m[1]) + 1911) + "-" + m[2] + "-" + m[3];
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    // Excel 日期序號（1900 日期系統）
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000);
    return d.getUTCFullYear() + "-" + 補零(d.getUTCMonth() + 1) + "-" + 補零(d.getUTCDate());
  }
  return "";
}

// 金額加千分位，例：12345 → 12,345
function 金額(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString("en-US");
}

// 把金額轉成國字大寫（收據用），例：600 → 陸佰元整、10005 → 壹萬零伍元整
function 國字金額(n) {
  const 數 = ["零", "壹", "貳", "參", "肆", "伍", "陸", "柒", "捌", "玖"];
  const 小單位 = ["", "拾", "佰", "仟"];
  const 大單位 = ["", "萬", "億", "兆"];
  let v = Math.round(Math.abs(Number(n) || 0));
  if (!v) return "零元整";
  const 各組 = [];
  while (v > 0) { 各組.push(v % 10000); v = Math.floor(v / 10000); }
  let 結果 = "";
  let 前面有字 = false;
  let 待補零 = false;
  for (let g = 各組.length - 1; g >= 0; g--) {
    const x = 各組[g];
    if (x === 0) { if (前面有字) 待補零 = true; continue; }
    if (前面有字 && x < 1000) 待補零 = true;
    let 段 = "";
    let 段補零 = false;
    for (let i = 3; i >= 0; i--) {
      const d = Math.floor(x / Math.pow(10, i)) % 10;
      if (d === 0) { if (段) 段補零 = true; continue; }
      if (段補零) { 段 += "零"; 段補零 = false; }
      段 += 數[d] + 小單位[i];
    }
    結果 += (待補零 ? "零" : "") + 段 + 大單位[g];
    待補零 = false;
    前面有字 = true;
  }
  return 結果 + "元整";
}

// 產生一個不重複的編號（時間＋亂數）
function 新編號() {
  const 亂 = new Uint8Array(6);
  crypto.getRandomValues(亂);
  return Date.now().toString(36) + Array.from(亂, function (b) { return 補零(b.toString(16)); }).join("");
}

// 防公式注入：儲存格開頭是 = + - @ Tab 換行 時，前面加一個單引號
function 防公式(v) {
  const s = String(v == null ? "" : v);
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}

// 把二維陣列轉成 CSV 文字（含 BOM，Excel 開中文不亂碼；並防公式注入）
function 轉CSV(列) {
  const 行 = 列.map(function (r) {
    return r.map(function (v) {
      const s = 防公式(v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",");
  });
  return "﻿" + 行.join("\r\n") + "\r\n";
}

// 解析 CSV 文字成二維陣列（支援雙引號、欄內換行）
function 解析CSV(text) {
  text = String(text).replace(/^﻿/, "");
  const 列 = [];
  let 目前列 = [];
  let 欄 = "";
  let 引號中 = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (引號中) {
      if (c === '"') {
        if (text[i + 1] === '"') { 欄 += '"'; i++; } else 引號中 = false;
      } else 欄 += c;
    } else if (c === '"') 引號中 = true;
    else if (c === ",") { 目前列.push(欄); 欄 = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      目前列.push(欄); 欄 = "";
      列.push(目前列); 目前列 = [];
    } else 欄 += c;
  }
  if (欄 !== "" || 目前列.length) { 目前列.push(欄); 列.push(目前列); }
  return 列.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ""; }); });
}

// 下載檔案：用 Blob URL，1.5 秒後撤銷
function 下載檔案(檔名, 內容, 類型) {
  const blob = 內容 instanceof Blob ? 內容 : new Blob([內容], { type: 類型 || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = 檔名;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
}

// 比較兩個值做排序（數字比大小、文字依中文筆畫／字典順序）
function 比較(a, b) {
  if (a == null || a === "") return b == null || b === "" ? 0 : 1;
  if (b == null || b === "") return -1;
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b), "zh-Hant-TW", { numeric: true });
}

// 深拷貝一個資料物件（只含 JSON 能表示的內容）
function 深拷貝(o) {
  return o == null ? o : JSON.parse(JSON.stringify(o));
}

// 檔案說明：把協會資料整理成「官網資料檔」（site-data.js）的內容；只放公開資訊，不含會員個資

// 從附件路徑取出官網上的檔案位置（附件/官網下載/abc_章程.pdf → 資料/檔案/abc_章程.pdf）
function 官網檔案位置(附件路徑) {
  const 檔名 = String(附件路徑 || "").split("/").pop();
  return 檔名 ? "資料/檔案/" + 檔名 : "";
}

// 依協會資料產生官網要用的資料物件（只挑「公開」的項目，依日期排序）
function 產生官網資料(資料, 發布時間) {
  const 設 = 資料.設定 || {};
  const 公開 = function (清單) { return (清單 || []).filter(function (x) { return x.公開 !== false; }); };
  const 依日期新到舊 = function (a, b) { return String(b.日期 || "").localeCompare(String(a.日期 || "")); };
  const 報名 = 資料.報名 || [];

  const 活動 = 公開(資料.活動).slice().sort(依日期新到舊).map(function (a) {
    const 正取數 = 報名.filter(function (r) { return r.活動id === a.id && r.狀態 === "正取"; }).length;
    const 成果公開 = a.成果公開 === true;
    return {
      id: a.id, 名稱: a.名稱, 類別: a.類別 || "", 日期: a.日期 || "", 開始時間: a.開始時間 || "", 結束時間: a.結束時間 || "",
      地點: a.地點 || "", 名額: Number(a.名額) || 0, 候補名額: Number(a.候補名額) || 0, 費用: Number(a.費用) || 0,
      截止日: a.截止日 || "", 說明: a.說明 || "", 已報名數: 正取數,
      成果說明: 成果公開 ? (a.成果說明 || "") : "",
      照片: 成果公開 ? (a.照片 || []).map(官網檔案位置) : []
    };
  });

  return {
    格式: "協會官網資料",
    格式版本: 1,
    發布時間: 發布時間 || "",
    範例資料: !!設.範例資料,
    協會: {
      名稱: 設.協會名稱 || "", 標語: 設.標語 || "", 宗旨: 設.宗旨 || "", 沿革: 設.沿革 || "", 章程: 設.章程 || "",
      地址: 設.地址 || "", 電話: 設.電話 || "", 傳真: 設.傳真 || "", Email: 設.Email || "", 服務時間: 設.服務時間 || "",
      組別: 設.組別 || [], 服務機關: 設.服務機關 || [],
      入會費: (設.會費標準 || {}).入會費 || 0, 常年會費: (設.會費標準 || {}).常年會費 || 0
    },
    理監事: (資料.理監事 || []).slice().sort(function (a, b) { return (Number(a.排序) || 0) - (Number(b.排序) || 0); })
      .map(function (p) { return { 職稱: p.職稱, 姓名: p.姓名, 服務機關: p.服務機關 || "" }; }),
    消息: 公開(資料.消息).slice().sort(function (a, b) {
      if (!!b.置頂 !== !!a.置頂) return b.置頂 ? 1 : -1;
      return 依日期新到舊(a, b);
    }).map(function (n) { return { id: n.id, 標題: n.標題, 分類: n.分類 || "", 日期: n.日期 || "", 內文: n.內文 || "", 置頂: !!n.置頂 }; }),
    活動: 活動,
    福利: 公開(資料.福利).map(function (b) { return { 名稱: b.名稱, 對象: b.對象 || "", 內容: b.內容 || "", 申請方式: b.申請方式 || "" }; }),
    特約商店: 公開(資料.特約商店).map(function (s) { return { 名稱: s.名稱, 類別: s.類別 || "", 優惠內容: s.優惠內容 || "", 地址: s.地址 || "", 電話: s.電話 || "" }; }),
    權益成果: 公開(資料.權益成果).slice().sort(依日期新到舊)
      .map(function (r) { return { 標題: r.標題, 類型: r.類型 || "", 日期: r.日期 || "", 摘要: r.摘要 || "", 結果: r.結果 || "" }; }),
    法規連結: (設.法規連結 || []).map(function (l) { return { 名稱: l.名稱, 網址: l.網址 }; }),
    下載: 公開(資料.下載).map(function (d) {
      return { 名稱: d.名稱, 分類: d.分類 || "", 說明: d.說明 || "", 檔案: 官網檔案位置(d.附件), 檔名: d.檔名 || "" };
    }),
    常見問答: 公開(資料.常見問答).slice().sort(function (a, b) { return (Number(a.排序) || 0) - (Number(b.排序) || 0); })
      .map(function (q) { return { 分類: q.分類 || "", 問題: q.問題, 答案: q.答案 }; })
  };
}

// 把官網資料物件轉成 site-data.js 的文字內容（JSON 內的 < 與換行分隔字元會跳脫，避免被誤判成標籤）
function 官網資料檔內容(官網資料) {
  const json = JSON.stringify(官網資料, null, 1)
    .replace(/</g, "\\u003c").replace(/>/g, "\\u003e")
    .replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
  return "/* 官網資料檔：由會務管理系統「發布到官網」產生，請勿手動修改 */\nwindow.SITE_DATA = " + json + ";\n";
}

// 活動是否還可以報名（未過截止日、未過活動日、未額滿或還有候補）

  if (a.截止日 && a.截止日 < 今) return false;

// 依欄位清單建立表單；回傳 {表單, 讀值()}
function 建立表單(欄們, 目的) {
  const 協 = 站.協會;
  const 表單 = h("form", { class: "表單", onsubmit: function (e) { e.preventDefault(); } });
  欄們.forEach(function (f) {

    } else if (f.多行) {
      輸入 = h("textarea", { id: id, "data-key": f.key, rows: 3 });
    } else {
      輸入 = h("input", { id: id, "data-key": f.key, type: f.型 || "text", autocomplete: f.自動 || "off" });
    }
    表單.appendChild(h("div", { class: "欄" + (f.多行 ? " 寬" : "") }, h("label", { for: id, class: f.必填 ? "必填" : "" }, f.標題), 輸入));
  });
  表單.appendChild(個資告知(目的));
  return {
    表單: 表單,
    讀值: function () {
      const 值 = {};
      表單.querySelectorAll("[data-key]").forEach(function (el) { 值[el.getAttribute("data-key")] = el.type === "checkbox" ? el.checked : el.value.trim(); });
      const 缺 = 欄們.filter(function (f) { return f.必填 && !值[f.key]; }).map(function (f) { return f.標題; });
      if (缺.length) return { 錯誤: "請填寫：" + 缺.join("、") };
      if (值.Email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(值.Email)) return { 錯誤: "Email 格式不正確" };
      if (!值.同意) return { 錯誤: "請勾選同意個人資料告知" };
      delete 值.同意;
      return { 值: 值 };
    }
  };
}

        列印申請書(值);
      } }, "列印申請書"), " ",
      h("button", { class: "鈕", type: "button", id: "下載申請檔鈕", onclick: function () {
        const 值 = 取值();
        if (!值) return;
        下載申請檔("入會申請", 值, null, "入會申請_" + 值.姓名);
        訊息.appendChild(h("p", { class: "完成訊息" }, "已產生入會申請資料檔，請寄給協會。"));
      } }, "下載申請資料檔")),
    訊息)));
}

// 把入會申請書放到列印區並列印（A4，標楷體）
function 列印申請書(值) {
  const 協 = 站.協會;
  const 區 = 清空(document.getElementById("列印區"));
  const 列 = function (名, v) { return h("tr", null, h("th", null, 名), h("td", null, v || "")); };
  區.appendChild(h("div", { class: "申請書" },
    h("h1", null, 協.名稱 + "　入會申請書"),
    h("table", null, h("tbody", null,
      列("姓名", 值.姓名), 列("員工編號", 值.員工編號), 列("服務機關", 值.服務機關), 列("單位", 值.單位), 列("職稱", 值.職稱),
      列("公務電話", 值.公務電話), 列("Email", 值.Email), 列("備註", 值.備註),
      列("申請日期", 民國(今天())), 列("申請人簽章", ""))),
    h("p", null, "本人認同本會宗旨，願遵守本會章程，申請入會。"),
    h("h3", null, "以下由協會填寫"),
    h("table", null, h("tbody", null, 列("收件日期", ""), 列("審核結果", "□ 核准　□ 不核准"), 列("會員編號", ""), 列("承辦人／秘書長／理事長", "")))));
  if (!navigator.webdriver) window.print();
}

// 下載專區：依分類列出檔案
function 下載專區() {
  清空(內容區).appendChild(標題("下載專區"));
  if (!站.下載.length) { 內容區.appendChild(h("p", { class: "次要字" }, "尚無資料")); return; }
  const 分類們 = Array.from(new Set(站.下載.map(function (d) { return d.分類 || "其他"; })));
  分類們.forEach(function (c) {
    內容區.appendChild(區段(c, h("ul", { class: "消息列" }, 站.下載.filter(function (d) { return (d.分類 || "其他") === c; }).map(function (d) {
      return h("li", null, d.檔案 ? h("a", { href: d.檔案, download: d.檔名 || null }, d.名稱) : h("span", null, d.名稱),
        h("span", { class: "次要字 小字" }, [d.說明, d.檔名].filter(Boolean).join("　")));
    }))));
  });
}

// 常見問答：可展開
function 常見問答() {
  清空(內容區).appendChild(標題("常見問答"));
  if (!站.常見問答.length) { 內容區.appendChild(h("p", { class: "次要字" }, "尚無資料")); return; }
  內容區.appendChild(h("div", null, 站.常見問答.map(function (q) {
    return h("details", { class: "問答" }, h("summary", null, q.問題), 多行(q.答案));
  })));
}

// 聯絡我們
function 聯絡我們() {
  const 協 = 站.協會;
  清空(內容區).appendChild(標題("聯絡我們"));
  const 列 = function (名, v, 連結) { return v ? h("p", null, h("strong", null, 名 + "："), 連結 ? h("a", { href: 連結 }, v) : v) : null; };
  內容區.appendChild(h("div", { class: "卡" },
    h("h2", null, 協.名稱),
    列("地址", 協.地址), 列("電話", 協.電話, 協.電話 ? "tel:" + 協.電話.replace(/[^\d+]/g, "") : null), 列("傳真", 協.傳真),
    列("Email", 協.Email, 協.Email ? "mailto:" + 協.Email : null), 列("服務時間", 協.服務時間)));
}

// 依頁面名稱畫出內容
function 顯示頁面() {
  if (!站 || 站.格式 !== "協會官網資料") {
    清空(內容區).appendChild(h("div", { class: "卡" }, h("h1", null, "找不到網站資料"),
      h("p", null, "請由會務管理系統「官網發布」產生 資料/site-data.js，並放在本網站的 資料 資料夾。")));
    return;
  }
  設定外框();
  const 表 = { 首頁: 首頁, 關於協會: 關於協會, 最新消息: 最新消息, 活動: 活動頁, 會員福利: 會員福利, 權益專區: 權益專區, 入會申請: 入會申請, 下載專區: 下載專區, 常見問答: 常見問答, 聯絡我們: 聯絡我們 };
  (表[本頁] || 首頁)();
}

設定按鈕();
顯示頁面();

})();
</script>
</body>
</html>
